<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creatopia</title>
<style>
@font-face{font-family:CHL;src:url('../assets/fonts/ComicHelvetic_Light.otf')format('opentype')}
@font-face{font-family:CHM;src:url('../assets/fonts/ComicHelvetic_Medium.otf')format('opentype')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:CHL,sans-serif;user-select:none}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:0}
#topbar{position:fixed;top:0;left:0;right:0;height:46px;background:rgba(0,0,0,.28);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:100}
#menu-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;cursor:pointer;background:none;border:none;color:rgba(255,255,255,.8);transition:color .1s}
#menu-btn:hover{color:#fff}
#menu-btn svg{width:20px;height:20px;pointer-events:none}
#studio-btn{display:flex;align-items:center;gap:6px;padding:0 12px;height:30px;cursor:pointer;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);font-family:CHM,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:background .12s,color .12s}
#studio-btn:hover{background:rgba(255,255,255,.18);color:#fff}
#studio-btn.active{background:rgba(120,180,255,.22);color:#b8d8ff}
#studio-btn svg{width:14px;height:14px;pointer-events:none}
#mode-label{font-family:CHM,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-left:2px}
#pause{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .15s}
#pause.open{opacity:1;pointer-events:auto}
#pause-panel{background:rgba(15,15,25,.88);border:1px solid rgba(255,255,255,.1);padding:28px 26px;min-width:200px;display:flex;flex-direction:column;gap:8px}
.pbtn{display:flex;align-items:center;justify-content:center;padding:11px 20px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font-family:CHM,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:background .12s}
.pbtn:hover{background:rgba(255,255,255,.14)}
.pbtn.exit{background:rgba(140,30,30,.25);border-color:rgba(200,60,60,.3);color:rgba(255,120,120,.9)}
.pbtn.exit:hover{background:rgba(140,30,30,.42);color:#fff}
#studio-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:6px 16px;font-family:CHL,sans-serif;font-size:11px;color:rgba(255,255,255,.5);pointer-events:none;z-index:90;display:none;white-space:nowrap}
#studio-hint.show{display:block}
</style>
</head>

<div id="topbar">
  <button id="menu-btn">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>

      <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l5.653-4.655m5.833-4.329a18.795 18.795 0 002.684-1.88c-.465-3.223-3.474-5.7-6.755-5.7C7.78 2.25 5.25 4.78 5.25 7.5c0 3.281 2.477 6.29 5.7 6.755a18.795 18.795 0 001.88-2.684"/>

    <button class="pbtn" id="resume-btn">Resume</button>
    <button class="pbtn exit" id="exit-btn">Exit</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.163.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.163.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { applyAnimations } from '../scripts/game/animations.js';

const GRAVITY=196.2,JUMP_POWER=53.8,WALK_SPEED=16,TERM_VEL=-75,AIRBORNE_T=0.13;
const MENU_URL='../index.html#home';

// scene
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,80,200);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
if('outputColorSpace' in renderer)renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// lighting
scene.add(new THREE.HemisphereLight(0xaee2ff,0x55482f,0.65));
scene.add(new THREE.AmbientLight(0xffffff,0.25));
const dirLight=new THREE.DirectionalLight(0xfff2e0,1.15);
dirLight.position.set(20,40,20);dirLight.castShadow=true;
dirLight.shadow.mapSize.set(1536,1536);
Object.assign(dirLight.shadow.camera,{near:.5,far:350,left:-120,right:120,top:120,bottom:-120});
dirLight.shadow.bias=-0.0015;dirLight.shadow.normalBias=0.02;
scene.add(dirLight,dirLight.target);

// collision
const colliders=[];
function addCollider(box){
  const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
  colliders.push({cx:c.x,cy:c.y,cz:c.z,r:s.length()/2,hx:s.x/2,hy:s.y/2,hz:s.z/2,
    ax:{x:1,y:0,z:0},ay:{x:0,y:1,z:0},az:{x:0,y:0,z:1}});
}
function testOBB(x0,y0,z0,x1,y1,z1,o){
  const e=1e-6,tx=o.cx-(x0+x1)/2,ty=o.cy-(y0+y1)/2,tz=o.cz-(z0+z1)/2;
  const aHx=(x1-x0)/2,aHy=(y1-y0)/2,aHz=(z1-z0)/2;
  if(Math.abs(tx)>aHx+o.hx*(Math.abs(o.ax.x)+e)+o.hy*(Math.abs(o.ay.x)+e)+o.hz*(Math.abs(o.az.x)+e))return false;
  if(Math.abs(ty)>aHy+o.hx*(Math.abs(o.ax.y)+e)+o.hy*(Math.abs(o.ay.y)+e)+o.hz*(Math.abs(o.az.y)+e))return false;
  if(Math.abs(tz)>aHz+o.hx*(Math.abs(o.ax.z)+e)+o.hy*(Math.abs(o.ay.z)+e)+o.hz*(Math.abs(o.az.z)+e))return false;
  return true;
}
function hitTest(box){
  const bc=box.getCenter(new THREE.Vector3()),tr=box.getSize(new THREE.Vector3()).length()/2;
  for(const c of colliders){
    const dx=bc.x-c.cx,dy=bc.y-c.cy,dz=bc.z-c.cz;
    if(dx*dx+dy*dy+dz*dz>(tr+c.r)*(tr+c.r))continue;
    if(testOBB(box.min.x,box.min.y,box.min.z,box.max.x,box.max.y,box.max.z,c))return true;
  }
  return false;
}

// map
const MATS={
  grass:new THREE.MeshLambertMaterial({color:0x5ab552}),
  stone:new THREE.MeshLambertMaterial({color:0x9b9b9b}),
  wood: new THREE.MeshLambertMaterial({color:0xa0522d}),
  brick:new THREE.MeshLambertMaterial({color:0xb5651d}),
};
function addBlock(x,y,z,w,h,d,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);
  addCollider(new THREE.Box3().setFromObject(m));
}
addBlock(0,-0.6,0,200,1.2,200,MATS.grass);
[[-12,2,-12,4,4,4,'stone'],[-8,2,-12,4,4,4,'stone'],[-12,6,-12,4,4,4,'stone'],
 [12,2,12,4,4,4,'wood'],[16,2,12,4,4,4,'wood'],[12,6,12,4,4,4,'wood'],
 [-20,2,8,4,4,4,'brick'],[-16,2,8,4,4,4,'brick'],
 [20,2,-8,4,4,4,'stone'],[24,2,-8,4,4,4,'stone'],
 [-8,9,-8,12,1,12,'stone'],[8,13,8,12,1,12,'wood'],
 [-16,17,-4,8,1,8,'brick'],[0,21,0,8,1,8,'stone'],
].forEach(([x,y,z,w,h,d,m])=>addBlock(x,y,z,w,h,d,MATS[m]));

// skin
const PART_KEYS=['head','torso','arms','legs'],DEFAULT_SKIN='#FFCD9A';
const skinMeshes=[];
function loadSkin(){
  const d={head:DEFAULT_SKIN,torso:DEFAULT_SKIN,arms:DEFAULT_SKIN,legs:DEFAULT_SKIN};
  try{Object.assign(d,JSON.parse(localStorage.getItem('creatopia_skin_parts')||'{}'))}catch(e){}
  return d;
}
let skinColors=loadSkin();
function partFromName(n){
  n=(n||'').toLowerCase().replace(/armature/g,'');
  if(/head|face|skull|neck/.test(n))return'head';
  if(/arm|hand|shoulder/.test(n))return'arms';
  if(/leg|foot|thigh|knee/.test(n))return'legs';
  if(/torso|chest|spine|pelvis/.test(n))return'torso';
  return null;
}
function prepareSkin(root){
  scene.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);
  const H=(box.max.y-box.min.y)||1,cx=(box.min.x+box.max.x)/2,v=new THREE.Vector3();
  root.traverse(m=>{
    if(!m.isMesh)return;
    m.geometry=m.geometry.clone();
    const pos=m.geometry.attributes.position,n=pos.count;
    m.geometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));
    m.material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,metalness:0});
    const named=m.userData.part||partFromName(m.name);
    if(named){m.userData.part=named;skinMeshes.push(m);return;}
    const idx=new Uint8Array(n);
    for(let i=0;i<n;i++){
      v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);
      const hh=(v.y-box.min.y)/H,ax=Math.abs(v.x-cx)/H;
      idx[i]=hh>0.78?0:hh<0.4?3:ax>0.21?2:1;
    }
    m.userData.partIdx=idx;skinMeshes.push(m);
  });
  paintSkin();
}
function paintSkin(){
  const cc={};PART_KEYS.forEach(k=>cc[k]=new THREE.Color(skinColors[k]));
  skinMeshes.forEach(m=>{
    const attr=m.geometry.attributes.color,arr=attr.array,idx=m.userData.partIdx,fixed=m.userData.part;
    for(let i=0;i<arr.length/3;i++){
      const c=cc[fixed||PART_KEYS[idx[i]]];arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;
    }
    attr.needsUpdate=true;
  });
}
window.addEventListener('storage',e=>{
  if(e.key==='creatopia_skin_parts'){skinColors=loadSkin();paintSkin();}
  if(e.key==='creatopia_face')applyFace(FACE_ALIASES[e.newValue]||e.newValue||DEFAULT_FACE);
});

// face: front-only cap of a slightly larger sphere on the ball head, UV-mapped planar
const FACE_DIR='../assets/customize/faces/',DEFAULT_FACE='deafult_face.png',FACE_CAP=58*Math.PI/180;
const FACE_ALIASES={'smile_face.png':'happy_face.png'};   // old saves after the Smile -> Happy rename
function getFace(){const f=localStorage.getItem('creatopia_face')||DEFAULT_FACE;return FACE_ALIASES[f]||f;}
let faceMesh=null,faceMat=null,faceFile=getFace();
function applyFace(file){
  faceFile=file;
  if(!faceMesh)return;
  if(!file){faceMesh.visible=false;return;}
  new THREE.TextureLoader().load(FACE_DIR+file,tex=>{
    if(faceFile!==file)return;
    tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
    if(faceMat.map)faceMat.map.dispose();
    faceMat.map=tex;faceMat.needsUpdate=true;faceMesh.visible=true;
  },undefined,()=>{if(faceFile===file)faceMesh.visible=false;});
}
function buildFace(model){
  model.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(model.matrixWorld).invert(),v=new THREE.Vector3(),hb=new THREE.Box3();
  model.traverse(m=>{
    if(!m.isMesh)return;
    const named=m.userData.part,pi=m.userData.partIdx;
    if(named&&named!=='head')return;
    const rel=new THREE.Matrix4().multiplyMatrices(inv,m.matrixWorld),pos=m.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){if(!named&&(!pi||pi[i]!==0))continue;hb.expandByPoint(v.fromBufferAttribute(pos,i).applyMatrix4(rel));}
  });
  if(hb.isEmpty())return;
  const size=hb.getSize(new THREE.Vector3()),r=Math.max(size.x,size.z)/2,c=hb.getCenter(new THREE.Vector3());
  c.y=hb.max.y-r;   // ball head: bbox top minus radius = sphere centre
  // front from the hands: left axis = LeftHand -> RightHand (verified on this model), forward = left x up
  const up=new THREE.Vector3(0,1,0),left=new THREE.Vector3(1,0,0);
  const lh=model.getObjectByName('LeftHand'),rh=model.getObjectByName('RightHand');
  if(lh&&rh){
    const a=model.worldToLocal(lh.getWorldPosition(new THREE.Vector3())),b=model.worldToLocal(rh.getWorldPosition(new THREE.Vector3()));
    const d=new THREE.Vector3(b.x-a.x,0,b.z-a.z);if(d.lengthSq()>1e-8)left.copy(d.normalize());
  }
  const fwd=new THREE.Vector3().crossVectors(left,up);
  const R=r*1.012,K=Math.sin(FACE_CAP),cosCap=Math.cos(FACE_CAP);
  const g=new THREE.SphereGeometry(R,64,48),p=g.attributes.position,uv=g.attributes.uv,front=[],d=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    d.fromBufferAttribute(p,i).divideScalar(R);
    uv.setXY(i,0.5+d.dot(left)/(2*K),0.5+d.dot(up)/(2*K));
    front.push(d.dot(fwd)>=cosCap);
  }
  const ix=g.index.array,keep=[];
  for(let t=0;t<ix.length;t+=3)if(front[ix[t]]&&front[ix[t+1]]&&front[ix[t+2]])keep.push(ix[t],ix[t+1],ix[t+2]);
  g.setIndex(keep);
  faceMat=new THREE.MeshStandardMaterial({transparent:true,roughness:.85,metalness:0,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  faceMesh=new THREE.Mesh(g,faceMat);faceMesh.position.copy(c);faceMesh.renderOrder=1;faceMesh.visible=false;
  model.add(faceMesh);
  applyFace(faceFile);
}

// player
const playerGroup=new THREE.Group();
scene.add(playerGroup);
playerGroup.position.set(0,5,0);

function buildFallback(){
  const g=new THREE.Group();
  const b=(w,h,d,part,par,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial());m.userData.part=part;m.position.set(px,py,pz);m.castShadow=true;par.add(m);return m};
  b(2,2,1,'head',g,0,4.2,0);b(2,2,1,'torso',g,0,2.5,0);
  const lAG=new THREE.Group();lAG.position.set(-1.5,3.5,0);g.add(lAG);
  const rAG=new THREE.Group();rAG.position.set(1.5,3.5,0);g.add(rAG);
  const lLG=new THREE.Group();lLG.position.set(-0.55,1.5,0);g.add(lLG);
  const rLG=new THREE.Group();rLG.position.set(0.55,1.5,0);g.add(rLG);
  [lAG,rAG].forEach(ag=>b(1,2,1,'arms',ag,0,-1,0));
  [lLG,rLG].forEach(lg=>b(1,2,1,'legs',lg,0,-1,0));
  return{g,lAG,rAG,lLG,rLG};
}
const fb=buildFallback();
playerGroup.add(fb.g);
prepareSkin(fb.g);
let charLimbs={lAG:fb.lAG,rAG:fb.rAG,lLG:fb.lLG,rLG:fb.rLG};

new GLTFLoader().load('../assets/models/CreatopiaBody.glb',gltf=>{
  playerGroup.remove(fb.g);
  skinMeshes.length=0;
  const model=gltf.scene;
  const rawH=(new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3())).y||1;
  model.scale.setScalar(5/rawH);
  model.position.y=-(new THREE.Box3().setFromObject(model).min.y);
  model.traverse(c=>{if(c.isMesh){c.castShadow=c.receiveShadow=true;}});
  playerGroup.add(model);
  prepareSkin(model);
  model.updateMatrixWorld(true);
  buildFace(model);

  const rH=model.getObjectByName('RightHand'),lH=model.getObjectByName('LeftHand');
  const lL=model.getObjectByName('LeftLeg'), rL=model.getObjectByName('RightLeg');

  if(rH&&lH&&lL&&rL){
    // Rotate every limb around its own top (shoulder / hip), not around the node origin.
    // Same rule for all four limbs, so left and right swing identically even if the GLB
    // origins differ. If an origin already sits at the joint this changes nothing.
    playerGroup.updateMatrixWorld(true);
    const wrapPivot=node=>{
      const parent=node.parent,box=new THREE.Box3().setFromObject(node);
      if(!parent||box.isEmpty())return node;
      const wp=new THREE.Vector3();node.getWorldPosition(wp);
      const joint=parent.worldToLocal(new THREE.Vector3(wp.x,box.max.y,wp.z));
      const pivot=new THREE.Group();
      pivot.position.copy(joint);
      node.position.sub(joint);
      parent.add(pivot);pivot.add(node);
      return pivot;
    };
    charLimbs = { rAG: wrapPivot(rH), lAG: wrapPivot(lH), lLG: wrapPivot(lL), rLG: wrapPivot(rL) };
  }

  // Hat — add directly to model root so it uses the same coord space as the GLB.
  // The GLB already has the hat positioned correctly relative to the character.
  // up to 2 hats (creatopia_hats = JSON array; falls back to the old single creatopia_hat key)
  const hatIds=(()=>{
    let a=[];
    try{
      const raw=localStorage.getItem('creatopia_hats');
      if(raw!==null){const p=JSON.parse(raw);if(Array.isArray(p))a=p;}
      else{const o=localStorage.getItem('creatopia_hat');if(o)a=[o];}
    }catch(e){}
    return a.filter(x=>typeof x==='string'&&x).slice(0,2);
  })();
  hatIds.forEach(hatId=>{
    new GLTFLoader().load('../assets/customize/hats/'+hatId+'.glb',hgltf=>{
      hgltf.scene.traverse(c=>{if(c.isMesh)c.castShadow=true;});
      model.add(hgltf.scene);
    },null,err=>console.warn('hat load failed',err));
  });
},null,err=>console.warn('GLB load failed:',err));

// player state
const pSize=new THREE.Vector3(2,5,1),pBox=new THREE.Box3();
const updateBox=pos=>pBox.setFromCenterAndSize(new THREE.Vector3(pos.x,pos.y+2.5,pos.z),pSize);
let yVel=0,grounded=false,animTime=0,animState='idle',airTimer=0,visOff=0;

// camera
let camR=15,camT=Math.PI,camP=Math.PI/6,rightDown=false;
window.addEventListener('mousedown',e=>{if(e.button===2)rightDown=true;});
window.addEventListener('mouseup',  e=>{if(e.button===2)rightDown=false;});
window.addEventListener('mousemove',e=>{
  if(!rightDown||isMenu||studioMode)return;
  camT-=e.movementX*0.008;
  camP=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,camP+e.movementY*0.008));
});
window.addEventListener('wheel',e=>{if(!isMenu)camR=Math.max(5,Math.min(125,camR+e.deltaY*0.05));},{ passive:true });
window.addEventListener('contextmenu',e=>e.preventDefault());

// input
const keys={w:0,a:0,s:0,d:0,' ':0};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=1;if(e.key==='Escape')toggleMenu();});
window.addEventListener('keyup',  e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=0;});

// pause
let isMenu=false;
const pauseEl=document.getElementById('pause');
const toggleMenu=()=>setMenu(!isMenu);
const setMenu=v=>{isMenu=v;pauseEl.classList.toggle('open',v);};
document.getElementById('menu-btn')  .addEventListener('click',()=>setMenu(true));
document.getElementById('resume-btn').addEventListener('click',()=>setMenu(false));
document.getElementById('exit-btn')  .addEventListener('click',()=>{window.close();setTimeout(()=>{if(!window.closed)location.href=MENU_URL;},150);});

// studio
let studioMode=false,sTheta=Math.PI,sPhi=0.4,sDist=30,sRightDown=false;
const sTgt=new THREE.Vector3(0,2,0),ray=new THREE.Raycaster(),sMat=new THREE.MeshLambertMaterial({color:0x6688cc});
document.getElementById('studio-btn').addEventListener('click',()=>{
  studioMode=!studioMode;
  document.getElementById('studio-btn').classList.toggle('active',studioMode);
  document.getElementById('mode-label').textContent=studioMode?'Studio':'Player';
  document.getElementById('studio-hint').classList.toggle('show',studioMode);
  playerGroup.visible=!studioMode;
});
window.addEventListener('mousedown',e=>{
  if(!studioMode||isMenu||e.target.closest?.('#topbar'))return;
  if(e.button===2){sRightDown=true;return;}
  if(e.button===0){
    ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1),camera);
    const meshes=[];scene.traverse(c=>{if(c.isMesh)meshes.push(c);});
    const hit=ray.intersectObjects(meshes,true)[0];
    if(hit){
      const B=4,n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld),p=hit.point;
      const nb=new THREE.Mesh(new THREE.BoxGeometry(B,B,B),sMat.clone());
      nb.position.set(Math.round((p.x+n.x*B/2)/B)*B,Math.round((p.y+n.y*B/2)/B)*B,Math.round((p.z+n.z*B/2)/B)*B);
      nb.castShadow=nb.receiveShadow=true;scene.add(nb);addCollider(new THREE.Box3().setFromObject(nb));
    }
  }
});
window.addEventListener('mouseup',  e=>{if(e.button===2)sRightDown=false;});
window.addEventListener('mousemove',e=>{
  if(!studioMode||!sRightDown||isMenu)return;
  sTheta-=e.movementX*0.008;
  sPhi=Math.max(-Math.PI/2+0.05,Math.min(Math.PI/2-0.05,sPhi+e.movementY*0.008));
});

// moveAxis
function moveAxis(axis,d){
  const oy=playerGroup.position.y;
  playerGroup.position[axis]+=d;updateBox(playerGroup.position);
  if(!hitTest(pBox))return;
  if(!grounded){playerGroup.position.y=oy;playerGroup.position[axis]-=d;updateBox(playerGroup.position);return;}
  playerGroup.position.y+=1.51;updateBox(playerGroup.position);
  if(!hitTest(pBox)){
    let ok=false;
    for(let i=0;i<=1.51;i+=0.1){playerGroup.position.y-=0.1;updateBox(playerGroup.position);if(hitTest(pBox)){playerGroup.position.y+=0.1;updateBox(playerGroup.position);ok=true;break;}}
    if(ok)visOff-=(playerGroup.position.y-oy);
    else{playerGroup.position.y=oy;playerGroup.position[axis]-=d;}
  }else{playerGroup.position.y=oy;playerGroup.position[axis]-=d;updateBox(playerGroup.position);}
}

// vectors
const vFwd=new THREE.Vector3(),vRight=new THREE.Vector3(),vHead=new THREE.Vector3();
const vUp=new THREE.Vector3(0,1,0),qTgt=new THREE.Quaternion(),vOff=new THREE.Vector3(20,40,20);

// loop
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(isMenu){renderer.render(scene,camera);return;}
  if(studioMode){
    camera.position.set(sTgt.x+sDist*Math.sin(sTheta)*Math.cos(sPhi),sTgt.y+sDist*Math.sin(sPhi),sTgt.z+sDist*Math.cos(sTheta)*Math.cos(sPhi));
    camera.lookAt(sTgt);renderer.render(scene,camera);return;
  }
  playerGroup.position.y-=0.1;updateBox(playerGroup.position);
  grounded=hitTest(pBox);
  playerGroup.position.y+=0.1;updateBox(playerGroup.position);
  if(!grounded){
    yVel=Math.max(yVel-GRAVITY*dt,TERM_VEL);
    airTimer+=dt;if(airTimer>AIRBORNE_T)animState='jumping';
  }else{
    airTimer=0;if(yVel<0)yVel=0;
    if(keys[' ']){yVel=JUMP_POWER;grounded=false;airTimer=AIRBORNE_T+1;animState='jumping';}
  }
  playerGroup.position.y+=yVel*dt;updateBox(playerGroup.position);
  if(hitTest(pBox)){
    const dir=yVel<0?1:-1;
    for(let i=0;i<100;i++){playerGroup.position.y+=dir*0.05;updateBox(playerGroup.position);if(!hitTest(pBox))break;}
    if(yVel<0)grounded=true;
    yVel=0;
  }
  if(playerGroup.position.y<-80){playerGroup.position.set(0,5,0);yVel=0;}
  vFwd.set(0,0,0);camera.getWorldDirection(vFwd);vFwd.y=0;vFwd.normalize();
  vRight.crossVectors(vFwd,vUp).negate().normalize();
  const mv=new THREE.Vector3();
  if(keys['w'])mv.add(vFwd);if(keys['s'])mv.sub(vFwd);
  if(keys['d'])mv.sub(vRight);if(keys['a'])mv.add(vRight);
  const moving=mv.lengthSq()>0;
  if(moving){
    mv.normalize();
    moveAxis('x',mv.x*WALK_SPEED*dt);moveAxis('z',mv.z*WALK_SPEED*dt);
    qTgt.setFromAxisAngle(vUp,Math.atan2(mv.x,mv.z));
    playerGroup.quaternion.slerp(qTgt,15*dt);
    if(grounded)animState='moving';
  }else if(grounded){animState='idle';}
  visOff=THREE.MathUtils.lerp(visOff,0,15*dt);
  if(animState==='moving')animTime+=dt*WALK_SPEED*0.6;
  else if(animState==='idle')animTime=0;
  else animTime+=dt*5;
  applyAnimations(charLimbs,animState,dt,animTime,moving);
  vHead.set(playerGroup.position.x,playerGroup.position.y+4.5,playerGroup.position.z);
  camera.position.set(vHead.x+camR*Math.sin(camT)*Math.cos(camP),vHead.y+camR*Math.sin(camP),vHead.z+camR*Math.cos(camT)*Math.cos(camP));
  camera.lookAt(vHead);
  dirLight.position.copy(playerGroup.position).add(vOff);
  dirLight.target.position.copy(playerGroup.position);
  dirLight.target.updateMatrixWorld();
  renderer.render(scene,camera);
}
animate();
</script>
