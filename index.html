<!DOCTYPE html>
<html lang="pl" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatopia Alpha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#030305',
                        darkCard: '#08080c',
                    },
                    fontFamily: {
                        sans:  ['ComicHelvetic_Light', 'sans-serif'],
                        title: ['ComicHelvetic_Medium', 'sans-serif'],
                    },
                    animation: {
                        'liquid-flow': 'liquidFlow 22s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        liquidFlow: {
                            '0%':   { transform: 'translate(0px, 0px) scale(1)' },
                            '50%':  { transform: 'translate(30px, -20px) scale(1.05)' },
                            '100%': { transform: 'translate(-20px, 20px) scale(0.95)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'ComicHelvetic_Light';
            src: url('assets/fonts/ComicHelvetic_Light.otf') format('opentype'),
                 url('assets/fonts/ComicHelvetic_Light.ttf') format('truetype'),
                 url('assets/fonts/ComicHelvetic_Light.woff2') format('woff2'),
                 url('assets/fonts/ComicHelvetic_Light.woff') format('woff');
            font-weight: 300;
            font-style: normal;
        }

        @font-face {
            font-family: 'ComicHelvetic_Medium';
            src: url('assets/fonts/ComicHelvetic_Medium.otf') format('opentype'),
                 url('assets/fonts/ComicHelvetic_Medium.ttf') format('truetype'),
                 url('assets/fonts/ComicHelvetic_Medium.woff2') format('woff2'),
                 url('assets/fonts/ComicHelvetic_Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
        }

        body {
            background-color: #030305;
            color: #e2e8f0;
            font-family: 'ComicHelvetic_Light', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .font-title {
            font-family: 'ComicHelvetic_Medium', sans-serif;
        }

        .glass-panel {
            background: rgba(8, 8, 14, 0.6);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.08),
                inset 0 -1px 1px rgba(0, 0, 0, 0.6);
        }

        .glass-pill {
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-pill:hover {
            background: rgba(35, 35, 50, 0.55);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .glass-pill.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            opacity: 0.18;
        }
    </style>
</head>
<body class="h-screen w-full relative flex flex-col p-4 md:p-6 antialiased">

    <!-- Ambient background glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="ambient-blob animate-liquid-flow w-[500px] h-[500px] bg-slate-800 -top-20 -left-20"></div>
        <div class="ambient-blob animate-liquid-flow w-[600px] h-[600px] bg-indigo-950" style="top:50%; right:2.5rem; animation-delay:-7s;"></div>
    </div>

    <div class="relative z-10 flex flex-col lg:flex-row w-full h-full gap-5 max-w-[1700px] mx-auto">

        <!-- LEFT SIDEBAR -->
        <aside class="w-full lg:w-80 flex flex-col shrink-0">
            <div class="glass-panel rounded-3xl p-5 md:p-6 flex flex-col h-full justify-between gap-6">

                <div class="flex flex-col gap-6">

                    <!-- LOGO -->
                    <div class="flex items-center px-1 pt-1 min-h-[48px]">
                        <img
                            src="assets/images/logos/Creatopia Alpha.png"
                            alt="Creatopia Alpha"
                            class="max-h-10 w-auto object-contain"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                        />
                        <span style="display:none;" class="font-title text-base font-medium tracking-wider text-white uppercase">Creatopia Alpha</span>
                    </div>

                    <!-- SEARCH -->
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search..."
                            class="w-full pl-10 pr-8 py-2.5 bg-black/40 text-xs text-white placeholder-slate-500 rounded-2xl border border-white/10 focus:outline-none focus:border-white/25 focus:bg-black/60 transition-all duration-300"
                        />
                        <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-white">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>

                    <div class="h-px w-full bg-white/5"></div>

                    <!-- NAV -->
                    <nav class="flex flex-col gap-2.5" id="main-nav">

                        <button data-tab="GAMES" class="nav-btn glass-pill active group w-full flex items-center px-4 py-3.5 rounded-2xl text-left">
                            <div class="flex items-center gap-3.5">
                                <div class="text-slate-400 group-hover:text-white group-[.active]:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 6H9C5.134 6 2 9.134 2 13c0 3.866 3.134 7 7 7h6c3.866 0 7-3.134 7-7 0-3.866-3.134-7-7-7z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 13h4m-2-2v4m7-2h.01m2 2h.01"/>
                                    </svg>
                                </div>
                                <span class="font-title text-xs tracking-wider text-slate-300 group-hover:text-white group-[.active]:text-white uppercase">Games</span>
                            </div>
                        </button>

                        <button data-tab="CREATE" class="nav-btn glass-pill group w-full flex items-center px-4 py-3.5 rounded-2xl text-left">
                            <div class="flex items-center gap-3.5">
                                <div class="text-slate-400 group-hover:text-white group-[.active]:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/>
                                    </svg>
                                </div>
                                <span class="font-title text-xs tracking-wider text-slate-300 group-hover:text-white group-[.active]:text-white uppercase">Create</span>
                            </div>
                        </button>

                        <button data-tab="CUSTOMIZE" class="nav-btn glass-pill group w-full flex items-center px-4 py-3.5 rounded-2xl text-left">
                            <div class="flex items-center gap-3.5">
                                <div class="text-slate-400 group-hover:text-white group-[.active]:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 18H7.5M13.5 12h6.75m-6.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 12H9"/>
                                    </svg>
                                </div>
                                <span class="font-title text-xs tracking-wider text-slate-300 group-hover:text-white group-[.active]:text-white uppercase">Customize</span>
                            </div>
                        </button>

                        <button data-tab="PROFILE" class="nav-btn glass-pill group w-full flex items-center px-4 py-3.5 rounded-2xl text-left">
                            <div class="flex items-center gap-3.5">
                                <div class="text-slate-400 group-hover:text-white group-[.active]:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                                    </svg>
                                </div>
                                <span class="font-title text-xs tracking-wider text-slate-300 group-hover:text-white group-[.active]:text-white uppercase">Profile</span>
                            </div>
                        </button>

                    </nav>
                </div>

                <!-- SETTINGS (bottom) -->
                <div class="pt-4 border-t border-white/5">
                    <button data-tab="SETTINGS" class="nav-btn glass-pill group w-full flex items-center px-4 py-3.5 rounded-2xl text-left">
                        <div class="flex items-center gap-3.5">
                            <div class="text-slate-400 group-hover:text-white group-[.active]:text-white transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </div>
                            <span class="font-title text-xs tracking-wider text-slate-300 group-hover:text-white group-[.active]:text-white uppercase">Settings</span>
                        </div>
                    </button>
                </div>

            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="flex-1 flex flex-col glass-panel rounded-3xl p-6 md:p-8 relative overflow-hidden transition-all duration-500">

            <div class="w-full flex justify-start items-center relative z-10">
                <h1 id="active-tab-title" class="font-title text-sm md:text-base tracking-[0.25em] text-white uppercase">GAMES</h1>
            </div>

            <div id="content-container" class="flex-1 my-6 flex flex-col justify-center items-center text-center relative z-10"></div>

        </main>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const activeTitle = document.getElementById('active-tab-title');
            const searchInput = document.getElementById('search-input');
            const clearBtn    = document.getElementById('clear-search');
            const navButtons  = document.querySelectorAll('.nav-btn');

            function setTab(tabKey) {
                activeTitle.textContent = tabKey;
                navButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabKey);
                });
            }

            navButtons.forEach(btn => {
                btn.addEventListener('click', () => setTab(btn.dataset.tab));
            });

            searchInput.addEventListener('input', () => {
                const q = searchInput.value.toLowerCase().trim();
                clearBtn.classList.toggle('hidden', q.length === 0);
                navButtons.forEach(btn => {
                    btn.style.display = btn.dataset.tab.toLowerCase().includes(q) ? 'flex' : 'none';
                });
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                navButtons.forEach(btn => btn.style.display = 'flex');
            });

            setTab('GAMES');
        });
    </script>
</body>
</html>
