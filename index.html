<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creatopia Alpha</title>
<style>
@font-face{font-family:CHL;src:url('assets/fonts/ComicHelvetic_Light.otf')format('opentype')}
@font-face{font-family:CHM;src:url('assets/fonts/ComicHelvetic_Medium.otf')format('opentype')}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--sur:#111118;--bdr:rgba(255,255,255,.07);
  --dim:rgba(255,255,255,.3);--acc:rgba(255,255,255,.1);--txt:#c8c8d8;
  --w:260px;--wc:72px;--th:66px;--r:14px;
  --ease:.38s cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:CHL,sans-serif;font-size:15px;letter-spacing:.04em;-webkit-font-smoothing:antialiased}

/* baseline nudge */
.lbl,.m-top h1,.lt,.setting-label,.setting-desc,.lang-name{position:relative;top:2px}

/* blobs */
.blob{position:fixed;border-radius:50%;filter:blur(130px);opacity:.12;pointer-events:none;
  animation:bf 22s ease-in-out infinite alternate}
@keyframes bf{0%{transform:translate(0,0)scale(1)}50%{transform:translate(25px,-18px)scale(1.04)}to{transform:translate(-18px,18px)scale(.96)}}

/* shell */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;position:relative;z-index:1}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;height:var(--th);padding:0 24px;
  background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0;gap:16px}

.t-logo{display:flex;align-items:center;justify-content:center;
  width:var(--w);min-width:var(--w);overflow:hidden;flex-shrink:0;
  transition:width var(--ease),min-width var(--ease)}
.app.col .t-logo{width:var(--wc);min-width:var(--wc)}
.t-logo img{max-height:36px;width:auto;object-fit:contain;flex-shrink:0}
.lt{font-family:CHM,sans-serif;font-size:14px;letter-spacing:.14em;
  color:#fff;text-transform:uppercase;white-space:nowrap;display:none}

.t-search{flex:1;max-width:360px;position:relative;display:flex;align-items:center}
.t-search .si{position:absolute;left:12px;display:flex;align-items:center;pointer-events:none;color:var(--dim)}
.t-search .si img{width:16px;height:16px;filter:invert(1);opacity:.4}
.t-search input{width:100%;padding:10px 12px 10px 36px;background:rgba(255,255,255,.05);
  border:1px solid var(--bdr);border-radius:var(--r);color:#fff;
  font-family:CHL,sans-serif;font-size:14px;letter-spacing:.04em;outline:none;
  transition:border-color .18s,background .18s}
.t-search input::placeholder{color:var(--dim)}
.t-search input:focus{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
.t-search .cb{position:absolute;right:11px;display:none;align-items:center;cursor:pointer;color:var(--dim)}
.t-search .cb:hover{color:#fff}
.t-search .cb.on{display:flex}

/* ── ROW ── */
.row{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--w);min-width:var(--w);display:flex;flex-direction:column;
  background:var(--sur);border-right:1px solid var(--bdr);overflow:hidden;flex-shrink:0;
  transition:width var(--ease),min-width var(--ease)}
.app.col .sidebar{width:var(--wc);min-width:var(--wc)}

.nl{flex:1;display:flex;flex-direction:column;gap:5px;padding:14px 11px;overflow:hidden}

/* nav item */
.ni{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:var(--r);
  cursor:pointer;border:1px solid transparent;background:transparent;
  width:100%;white-space:nowrap;overflow:hidden;color:var(--dim);
  transition:background .18s,border-color .18s,color .18s}
.ni:hover{background:rgba(255,255,255,.06);border-color:var(--bdr);color:var(--txt)}
.ni.on{background:var(--acc);border-color:rgba(255,255,255,.13);color:#fff}

/* collapsed nav items — smooth icon centering */
.app.col .ni{padding:13px 0;gap:0;justify-content:center}

.ico{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  /* keep icon centered even during width transition */
  transition:margin var(--ease)}
.ico img,.ico svg{width:22px;height:22px;filter:invert(1);opacity:.45;display:block;transition:opacity .18s}
.ni:hover .ico img,.ni:hover .ico svg,
.ni.on  .ico img,.ni.on  .ico svg{opacity:1}

.lbl{font-family:CHM,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  overflow:hidden;max-width:200px;white-space:nowrap;
  opacity:1;flex-shrink:0;
  transition:max-width var(--ease),opacity var(--ease),margin var(--ease)}
.app.col .lbl{max-width:0;opacity:0;margin:0}

/* bottom area: settings + toggle */
.nb{display:flex;flex-direction:column;gap:5px;
  padding:8px 11px 14px;border-top:1px solid var(--bdr);flex-shrink:0}

/* toggle button — styled like a nav item */
.tog{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:var(--r);
  cursor:pointer;border:1px solid transparent;background:transparent;
  width:100%;white-space:nowrap;overflow:hidden;color:var(--dim);
  transition:background .18s,border-color .18s,color .18s}
.tog:hover{background:rgba(255,255,255,.06);border-color:var(--bdr);color:var(--txt)}
.app.col .tog{padding:13px 0;gap:0;justify-content:center}
.tog-ico{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tog-ico svg{opacity:.45;transition:opacity .18s,transform var(--ease)}
.tog:hover .tog-ico svg{opacity:1}
.app.col .tog-ico svg{transform:rotate(180deg)}
.tog-lbl{font-family:CHM,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  overflow:hidden;max-width:200px;white-space:nowrap;opacity:1;flex-shrink:0;
  position:relative;top:2px;
  transition:max-width var(--ease),opacity var(--ease),margin var(--ease)}
.app.col .tog-lbl{max-width:0;opacity:0;margin:0}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.m-top{display:flex;align-items:center;height:54px;padding:0 32px;
  border-bottom:1px solid var(--bdr);flex-shrink:0}
.m-top h1{font-family:CHM,sans-serif;font-size:18px;letter-spacing:.22em;color:#fff;text-transform:uppercase;line-height:1}
.m-body{flex:1;overflow:auto}

/* ── SETTINGS PAGE ── */
.settings-page{padding:36px 40px;max-width:640px}
.setting-block{margin-bottom:32px}
.setting-label{font-family:CHM,sans-serif;font-size:13px;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;margin-bottom:6px;display:block}
.setting-desc{font-size:13px;color:var(--dim);margin-bottom:16px;display:block}

/* language cards */
.lang-cards{display:flex;gap:10px;flex-wrap:wrap}
.lang-card{display:flex;align-items:center;gap:12px;padding:13px 18px;
  border-radius:var(--r);border:1px solid var(--bdr);background:rgba(255,255,255,.04);
  cursor:pointer;transition:background .18s,border-color .18s;user-select:none}
.lang-card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.lang-card.active{background:var(--acc);border-color:rgba(255,255,255,.2)}
.lang-flag{width:28px;height:20px;border-radius:4px;object-fit:cover;flex-shrink:0}
.lang-name{font-family:CHM,sans-serif;font-size:13px;letter-spacing:.08em;color:#fff}
</style>
</head>
<body>

<div class="blob" style="width:540px;height:540px;background:#1e293b;top:-120px;left:220px"></div>
<div class="blob" style="width:580px;height:580px;background:#1e1b4b;bottom:-80px;right:-40px;animation-delay:-9s"></div>

<div class="app" id="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="t-logo">
      <img src="assets/images/logos/Creatopia Alpha V2.png" alt="Creatopia Alpha"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="lt" style="display:none">Creatopia</span>
    </div>
    <div class="t-search">
      <div class="si">
        <img src="assets/icons/search_icon.svg" alt=""
             onerror="this.outerHTML='<svg width=&quot;16&quot; height=&quot;16&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z&quot;/></svg>'">
      </div>
      <input id="search" type="text" autocomplete="off" data-i18n-placeholder="search_placeholder">
      <span class="cb" id="cb">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </span>
    </div>
  </header>

  <div class="row">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nl" id="nav">

        <button class="ni on" data-tab="home" data-path="/home/">
          <span class="ico"><img src="assets/icons/home_icon.svg" alt=""
            onerror="this.outerHTML='<svg fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75&quot;/></svg>'">
          </span><span class="lbl" data-i18n="nav_home">Home</span>
        </button>

        <button class="ni" data-tab="create" data-path="/create/">
          <span class="ico"><img src="assets/icons/create_icon.svg" alt=""
            onerror="this.outerHTML='<svg fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z&quot;/></svg>'">
          </span><span class="lbl" data-i18n="nav_create">Create</span>
        </button>

        <button class="ni" data-tab="customize" data-path="/customize/">
          <span class="ico"><img src="assets/icons/customize_icon.svg" alt=""
            onerror="this.outerHTML='<svg fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 18H7.5M13.5 12h6.75m-6.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 12H9&quot;/></svg>'">
          </span><span class="lbl" data-i18n="nav_customize">Customize</span>
        </button>

        <button class="ni" data-tab="profile" data-path="/profile/">
          <span class="ico"><img src="assets/icons/profile_icon.svg" alt=""
            onerror="this.outerHTML='<svg fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z&quot;/></svg>'">
          </span><span class="lbl" data-i18n="nav_profile">Profile</span>
        </button>

        <button class="ni" data-tab="settings" data-path="/settings/">
          <span class="ico"><img src="assets/icons/settings_icon.svg" alt=""
            onerror="this.outerHTML='<svg fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z&quot;/><path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M15 12a3 3 0 11-6 0 3 3 0 016 0z&quot;/></svg>'">
          </span><span class="lbl" data-i18n="nav_settings">Settings</span>
        </button>

      </nav>

      <!-- bottom: toggle only -->
      <div class="nb">
        <button class="tog" id="tog" aria-label="Toggle navigation">
          <span class="tog-ico">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
          </span>
          <span class="tog-lbl">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="m-top"><h1 id="title">HOME</h1></div>
      <div class="m-body" id="content"></div>
    </div>

  </div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────
let strings = {};
let currentLang = localStorage.getItem('creatopia_lang') || 'en';

async function loadLang(lang) {
  try {
    const r = await fetch(`language/${lang}.json`);
    strings = await r.json();
    currentLang = lang;
    localStorage.setItem('creatopia_lang', lang);
    applyLang();
  } catch(e) { console.warn('Failed to load lang:', lang); }
}

function t(key) { return strings[key] || key; }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // update active tab title
  const active = document.querySelector('.ni.on');
  if (active) {
    const key = 'nav_' + active.dataset.tab;
    document.getElementById('title').textContent = t(key).toUpperCase();
  }
  // re-render settings if open
  if (document.querySelector('.ni.on')?.dataset.tab === 'settings') {
    renderSettings();
  }
  // update html lang attr
  document.documentElement.lang = currentLang;
}

// ── Routing ───────────────────────────────────────────
const BASE = 'https://play.creatopia.workers.dev';
const PATHS = {
  home:     '/home/',
  create:   '/create/',
  customize:'/customize/',
  profile:  '/profile/',
  settings: '/settings/',
};

// ── Tab / nav ─────────────────────────────────────────
const app    = document.getElementById('app');
const tog    = document.getElementById('tog');
const search = document.getElementById('search');
const cb     = document.getElementById('cb');
const titleEl= document.getElementById('title');
const content= document.getElementById('content');
const items  = document.querySelectorAll('.ni[data-tab]');

function setTab(tab, pushState = true) {
  items.forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const key = 'nav_' + tab;
  titleEl.textContent = t(key).toUpperCase() || tab.toUpperCase();

  if (pushState && PATHS[tab]) {
    history.pushState({ tab }, '', PATHS[tab]);
  }

  if (tab === 'settings') {
    renderSettings();
  } else {
    content.innerHTML = '';
  }
}

items.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

// handle browser back/forward
window.addEventListener('popstate', e => {
  if (e.state?.tab) setTab(e.state.tab, false);
});

// ── Sidebar toggle ────────────────────────────────────
tog.addEventListener('click', () => app.classList.toggle('col'));

// ── Search ────────────────────────────────────────────
search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim();
  cb.classList.toggle('on', q.length > 0);
  items.forEach(b => b.style.display = b.dataset.tab.includes(q) ? 'flex' : 'none');
});
cb.addEventListener('click', () => {
  search.value = '';
  cb.classList.remove('on');
  items.forEach(b => b.style.display = 'flex');
});

// ── Settings page ─────────────────────────────────────
const LANGS = [
  { code: 'en', label: 'English', flag: 'assets/images/flags/en.png' },
  { code: 'pl', label: 'Polski',  flag: 'assets/images/flags/pl.png' },
];

function renderSettings() {
  content.innerHTML = `
    <div class="settings-page">
      <div class="setting-block">
        <span class="setting-label" data-i18n="settings_language_label">${t('settings_language_label')}</span>
        <span class="setting-desc"  data-i18n="settings_language_desc">${t('settings_language_desc')}</span>
        <div class="lang-cards">
          ${LANGS.map(l => `
            <div class="lang-card ${currentLang === l.code ? 'active' : ''}" data-lang="${l.code}">
              <img class="lang-flag" src="${l.flag}"
                   onerror="this.style.display='none'"
                   alt="${l.label} flag">
              <span class="lang-name">${l.label}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;

  content.querySelectorAll('.lang-card').forEach(card => {
    card.addEventListener('click', () => loadLang(card.dataset.lang));
  });
}

// ── Init ──────────────────────────────────────────────
loadLang(currentLang).then(() => {
  // set active tab based on current URL path
  const path = location.pathname;
  const matched = Object.entries(PATHS).find(([,p]) => path.startsWith(p));
  const tab = matched ? matched[0] : 'home';
  setTab(tab, false);
  if (!matched) history.replaceState({ tab: 'home' }, '', PATHS.home);
});
</script>
</body>
</html>
