<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creatopia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}

#c{display:block;width:100vw;height:100vh}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;
  height:52px;
  background:rgba(8,8,16,0.78);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;
  padding:0 18px;
  gap:10px;
  z-index:100;
}

#menu-btn{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:38px;
  border-radius:9px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.8);
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
#menu-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.22)}
#menu-btn svg{width:18px;height:18px}

/* ── PAUSE OVERLAY ── */
#pause{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.58);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
#pause.open{opacity:1;pointer-events:auto}

#pause-panel{
  background:rgba(10,10,20,0.95);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  padding:36px 32px;
  min-width:230px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 28px 70px rgba(0,0,0,0.8);
  transform:scale(.93) translateY(8px);
  transition:transform .22s cubic-bezier(.16,1,.3,1);
}
#pause.open #pause-panel{transform:scale(1) translateY(0)}

.pbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 20px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.08);
  color:#fff;font-size:13px;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.pbtn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.22)}
.pbtn.exit{
  background:rgba(160,40,40,0.22);
  border-color:rgba(220,70,70,0.28);
  color:rgba(255,130,130,0.9);
}
.pbtn.exit:hover{background:rgba(160,40,40,0.38);border-color:rgba(220,70,70,0.5);color:#fff}
.pbtn svg{width:16px;height:16px;opacity:.85;flex-shrink:0}

/* crosshair */
#cross{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:18px;height:18px;
  pointer-events:none;z-index:50;
  opacity:.55;
}
#cross::before,#cross::after{
  content:'';position:absolute;background:#fff;border-radius:1px;
}
#cross::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#cross::after {width:100%;height:2px;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- crosshair -->
<div id="cross"></div>

<!-- top bar -->
<div id="topbar">
  <button id="menu-btn" title="Menu (Esc)">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
    </svg>
  </button>
</div>

<!-- pause / menu overlay -->
<div id="pause">
  <div id="pause-panel">
    <button class="pbtn" id="resume-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/>
      </svg>
      Resume
    </button>
    <button class="pbtn exit" id="exit-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
      </svg>
      Exit
    </button>
  </div>
</div>

<!-- Three.js from CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a1a3e);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x1a1a3e, 30, 80);

const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 200);
// Third-person camera offset from player
const CAM_OFFSET = new THREE.Vector3(0, 5, 10);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x8888cc, 0.7);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far  = 120;
sun.shadow.camera.left = sun.shadow.camera.bottom = -40;
sun.shadow.camera.right= sun.shadow.camera.top    =  40;
scene.add(sun);

// ─────────────────────────────────────────────
//  MATERIALS
// ─────────────────────────────────────────────
function mat(hex, rough=0.85, metal=0){
  return new THREE.MeshStandardMaterial({color:hex,roughness:rough,metalness:metal});
}

const M = {
  skin:  mat(0xf5deb3),
  shirt: mat(0x4a90e2),
  pants: mat(0x2c3e50),
  shoe:  mat(0x1a1a1a),
  eye:   mat(0x111111),
  grass: mat(0x3a7d44),
  dirt:  mat(0x7a5c3a),
  stone: mat(0x6e7a8a),
  wood:  mat(0x8b6914),
};

// ─────────────────────────────────────────────
//  BLOCK BUILDER
// ─────────────────────────────────────────────
const blockGeo = new THREE.BoxGeometry(1,1,1);

function makeBlock(x,y,z, matKey='stone'){
  const mesh = new THREE.Mesh(blockGeo, M[matKey]);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// ─────────────────────────────────────────────
//  MAP
// ─────────────────────────────────────────────
const blockMeshes = [];
const blockBoxes  = [];  // THREE.Box3 for collision

function addBlock(x,y,z,mkey){
  const m = makeBlock(x,y,z,mkey);
  blockMeshes.push(m);
  const box = new THREE.Box3().setFromObject(m);
  blockBoxes.push(box);
}

// Ground plane (grass blocks, y=0)
for(let x=-10; x<=10; x++){
  for(let z=-10; z<=10; z++){
    addBlock(x, 0, z, 'grass');
  }
}

// Scattered blocks
const mapData = [
  // [x, y, z, mat]
  [-3,1,-3,'stone'], [-3,2,-3,'stone'], [-3,1,-2,'stone'],
  [3,1,3,'wood'],  [3,2,3,'wood'],  [4,1,3,'wood'],
  [-5,1,5,'dirt'], [-5,2,5,'dirt'],
  [6,1,-4,'stone'],[7,1,-4,'stone'],[6,2,-4,'stone'],
  [0,1,6,'wood'], [1,1,6,'wood'], [0,2,6,'wood'],
  [-7,1,-7,'stone'],[-7,2,-7,'stone'],[-8,1,-7,'stone'],
  [8,1,8,'dirt'],[9,1,8,'dirt'],[8,2,8,'dirt'],
  // elevated platforms
  [-2,3,-6,'stone'],[-1,3,-6,'stone'],[0,3,-6,'stone'],
  [4,4,0,'wood'],[5,4,0,'wood'],[6,4,0,'wood'],
  [-6,5,2,'stone'],[-5,5,2,'stone'],[-4,5,2,'stone'],
];
mapData.forEach(([x,y,z,mk])=>addBlock(x,y,z,mk));

// ─────────────────────────────────────────────
//  CHARACTER (Roblox-inspired blocky)
// ─────────────────────────────────────────────
const charRoot = new THREE.Group();
scene.add(charRoot);

function box(w,h,d,mat,px,py,pz){
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(g,mat);
  m.position.set(px,py,pz);
  m.castShadow = true;
  charRoot.add(m);
  return m;
}

// Body parts (relative to charRoot which sits at feet)
const charHead  = box(0.7,0.65,0.65, M.skin,  0, 1.85, 0);
const charBody  = box(0.65,0.7,0.4,  M.shirt, 0, 1.15, 0);
const charLArmG = new THREE.Group(); charRoot.add(charLArmG);
const charRArmG = new THREE.Group(); charRoot.add(charRArmG);
const charLLegG = new THREE.Group(); charRoot.add(charLLegG);
const charRLegG = new THREE.Group(); charRoot.add(charRLegG);

// Arms — pivot at shoulder
charLArmG.position.set(-0.575, 1.5, 0);
charRArmG.position.set( 0.575, 1.5, 0);
const charLArm = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.7,0.3), M.shirt);
const charRArm = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.7,0.3), M.shirt);
charLArm.position.y = -0.35; charLArm.castShadow=true;
charRArm.position.y = -0.35; charRArm.castShadow=true;
charLArmG.add(charLArm);
charRArmG.add(charRArm);

// Legs — pivot at hip
charLLegG.position.set(-0.18, 0.8, 0);
charRLegG.position.set( 0.18, 0.8, 0);
const charLLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.75,0.3), M.pants);
const charRLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.75,0.3), M.pants);
charLLeg.position.y = -0.375; charLLeg.castShadow=true;
charRLeg.position.y = -0.375; charRLeg.castShadow=true;
charLLegG.add(charLLeg);
charRLegG.add(charRLeg);

// Eyes (small dark boxes on head face)
const eyeGeo = new THREE.BoxGeometry(0.12,0.1,0.05);
const eyeL = new THREE.Mesh(eyeGeo, M.eye);
const eyeR = new THREE.Mesh(eyeGeo, M.eye);
eyeL.position.set(-0.17, 0.06, 0.33);
eyeR.position.set( 0.17, 0.06, 0.33);
charHead.add(eyeL); charHead.add(eyeR);

// ─────────────────────────────────────────────
//  PLAYER STATE
// ─────────────────────────────────────────────
const player = {
  pos:    new THREE.Vector3(0, 1, 0),
  vel:    new THREE.Vector3(0, 0, 0),
  yaw:    0,   // horizontal rotation (radians)
  onGround: false,
};

const GRAVITY   = 22;
const SPEED     = 6;
const JUMP_VEL  = 9;
const PLAYER_H  = 2.1;  // height for collision
const PLAYER_R  = 0.32; // horizontal radius

// ─────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if((e.code==='Space'||e.code==='KeyW') && player.onGround){
    // only jump on Space
  }
  if(e.code==='Space' && player.onGround){
    player.vel.y = JUMP_VEL;
    player.onGround = false;
  }
  if(e.code==='Escape') togglePause();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// Pointer lock for mouse look
const canvas = document.getElementById('c');
canvas.addEventListener('click', ()=>{
  if(!paused) canvas.requestPointerLock();
});

let mouseDX = 0, mouseDY = 0;
let camPitch = 0.3; // vertical camera angle

document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement !== canvas) return;
  mouseDX += e.movementX;
  mouseDY += e.movementY;
});

// ─────────────────────────────────────────────
//  PAUSE
// ─────────────────────────────────────────────
let paused = false;
const pauseEl  = document.getElementById('pause');
const menuBtn  = document.getElementById('menu-btn');
const resumeBtn= document.getElementById('resume-btn');
const exitBtn  = document.getElementById('exit-btn');

function togglePause(){
  paused = !paused;
  pauseEl.classList.toggle('open', paused);
  if(paused && document.pointerLockElement === canvas){
    document.exitPointerLock();
  }
}
menuBtn.addEventListener('click',  togglePause);
resumeBtn.addEventListener('click',()=>{ paused=false; pauseEl.classList.remove('open'); });
exitBtn.addEventListener('click',  ()=>{ window.close(); history.back(); });

// ─────────────────────────────────────────────
//  COLLISION HELPERS
// ─────────────────────────────────────────────
const _box    = new THREE.Box3();
const _sphere = new THREE.Sphere();

function playerBox(pos){
  _box.min.set(pos.x-PLAYER_R, pos.y,         pos.z-PLAYER_R);
  _box.max.set(pos.x+PLAYER_R, pos.y+PLAYER_H, pos.z+PLAYER_R);
  return _box;
}

function resolveAxis(pos, vel, axis){
  const testPos = pos.clone();
  testPos[axis] += vel[axis];
  const pb = playerBox(testPos);
  let hit = false;
  for(const bb of blockBoxes){
    if(!pb.intersectsBox(bb)) continue;
    hit = true;
    if(vel[axis] > 0) testPos[axis] = bb.min[axis] - (axis==='y'?PLAYER_H:PLAYER_R) - 0.001;
    else              testPos[axis] = bb.max[axis]  + (axis==='y'?0:PLAYER_R) + 0.001;
    if(axis==='y' && vel[axis] < 0) player.onGround = true;
    vel[axis] = 0;
    break;
  }
  pos[axis] = testPos[axis];
}

// ─────────────────────────────────────────────
//  WALK ANIMATION
// ─────────────────────────────────────────────
let walkTime = 0;

function animateChar(moving, dt){
  if(moving && player.onGround) walkTime += dt * 8;
  else walkTime *= 0.85;

  const swing = Math.sin(walkTime) * 0.5;
  charLArmG.rotation.x =  swing;
  charRArmG.rotation.x = -swing;
  charLLegG.rotation.x = -swing;
  charRLegG.rotation.x =  swing;
}

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
const _dir    = new THREE.Vector3();
const _right  = new THREE.Vector3();
const _camPos = new THREE.Vector3();

let last = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts - last)/1000, 0.05);
  last = ts;

  if(!paused){
    // ── Mouse look ──
    player.yaw   -= mouseDX * 0.002;
    camPitch      = Math.max(-0.5, Math.min(0.6, camPitch + mouseDY * 0.002));
    mouseDX = mouseDY = 0;

    // ── Movement direction (relative to yaw) ──
    _dir.set(0,0,0);
    if(keys['KeyW']||keys['ArrowUp'])    _dir.z -= 1;
    if(keys['KeyS']||keys['ArrowDown'])  _dir.z += 1;
    if(keys['KeyA']||keys['ArrowLeft'])  _dir.x -= 1;
    if(keys['KeyD']||keys['ArrowRight']) _dir.x += 1;

    const moving = _dir.lengthSq() > 0;
    if(moving){
      _dir.normalize();
      // rotate by yaw
      const cos = Math.cos(player.yaw), sin = Math.sin(player.yaw);
      const wx = _dir.x*cos - _dir.z*sin;
      const wz = _dir.x*sin + _dir.z*cos;
      player.vel.x = wx * SPEED;
      player.vel.z = wz * SPEED;
      // face direction of movement
      charRoot.rotation.y = Math.atan2(wx, wz);
    } else {
      player.vel.x *= 0.12;
      player.vel.z *= 0.12;
    }

    // ── Gravity ──
    if(!player.onGround) player.vel.y -= GRAVITY * dt;
    player.onGround = false;

    // ── Collision per axis ──
    const dv = player.vel.clone().multiplyScalar(dt);
    resolveAxis(player.pos, dv, 'x');
    resolveAxis(player.pos, dv, 'y');
    resolveAxis(player.pos, dv, 'z');
    // sync vel after clamping
    if(dt > 0){
      player.vel.x = dv.x / dt;
      player.vel.y = dv.y / dt;
      player.vel.z = dv.z / dt;
    }

    // floor kill plane
    if(player.pos.y < -20){ player.pos.set(0,2,0); player.vel.set(0,0,0); }

    // ── Character mesh ──
    charRoot.position.copy(player.pos);
    animateChar(moving, dt);

    // ── Camera (third person) ──
    const cpSin = Math.sin(camPitch);
    const cpCos = Math.cos(camPitch);
    const ySin  = Math.sin(player.yaw);
    const yCos  = Math.cos(player.yaw);
    const dist  = 7;
    _camPos.set(
      player.pos.x + dist * ySin * cpCos,
      player.pos.y + PLAYER_H/2 + dist * cpSin,
      player.pos.z + dist * yCos * cpCos
    );
    camera.position.lerp(_camPos, 0.12);
    camera.lookAt(
      player.pos.x,
      player.pos.y + PLAYER_H * 0.55,
      player.pos.z
    );
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
