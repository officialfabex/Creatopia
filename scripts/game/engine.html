<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creatopia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
#c{display:block;width:100vw;height:100vh;cursor:none}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(6,6,14,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;padding:0 18px;gap:12px;
  z-index:100;pointer-events:auto;
}
#menu-btn{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:38px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.8);
  transition:background .15s,border-color .15s;
}
#menu-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff}
#menu-btn svg{width:18px;height:18px;pointer-events:none}

/* zoom indicator */
#zoom-lbl{
  font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.3);
  font-family:'Segoe UI',sans-serif;
}

/* ── PAUSE OVERLAY ── */
#pause{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
}
#pause.open{opacity:1;pointer-events:auto}
#pause-panel{
  background:rgba(8,8,18,.97);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:36px 32px;min-width:240px;
  display:flex;flex-direction:column;gap:11px;
  box-shadow:0 28px 72px rgba(0,0,0,.85);
  transform:scale(.93) translateY(10px);
  transition:transform .24s cubic-bezier(.16,1,.3,1);
}
#pause.open #pause-panel{transform:scale(1) translateY(0)}

.pbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 22px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);
  color:#fff;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  transition:background .15s,border-color .15s;
}
.pbtn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24)}
.pbtn.exit{background:rgba(160,40,40,.22);border-color:rgba(220,70,70,.28);color:rgba(255,130,130,.9)}
.pbtn.exit:hover{background:rgba(160,40,40,.4);border-color:rgba(220,70,70,.55);color:#fff}
.pbtn svg{width:16px;height:16px;opacity:.85;flex-shrink:0}

/* crosshair */
#cross{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:16px;height:16px;pointer-events:none;z-index:50;
}
#cross::before,#cross::after{
  content:'';position:absolute;background:rgba(255,255,255,.75);border-radius:1px;
}
#cross::before{width:2px;height:100%;left:calc(50% - 1px);top:0}
#cross::after{width:100%;height:2px;top:calc(50% - 1px);left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>

<div id="topbar">
  <button id="menu-btn">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
    </svg>
  </button>
  <span id="zoom-lbl"></span>
</div>

<div id="pause">
  <div id="pause-panel">
    <button class="pbtn" id="resume-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/>
      </svg>
      Resume
    </button>
    <button class="pbtn exit" id="exit-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
      </svg>
      Exit
    </button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.163.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════
//  CONSTANTS  (match Roblox defaults as closely
//  as possible in Three.js world-units ≈ studs)
// ═══════════════════════════════════════════════
const GRAVITY      = 196.2; // studs/s²  (Roblox workspace.Gravity default)
const WALK_SPEED   = 16;    // studs/s   (Humanoid.WalkSpeed)
const JUMP_POWER   = 50;    // studs/s   (Humanoid.JumpPower)
const CHAR_HEIGHT  = 5.0;   // studs     (total character height)
const HRP_OFFSET_Y = 2.5;   // studs     (HumanoidRootPart centre above feet)
const CAM_FOCUS_Y  = 3.5;   // studs     (camera focus above feet ≈ neck/head)
const CAM_DIST_DEF = 12.5;  // studs     (default zoom)
const CAM_DIST_MIN = 0.5;
const CAM_DIST_MAX = 80;
const CAM_PITCH_MAX=  80 * Math.PI/180; // ±80°  (Roblox clamping)
const CAM_PITCH_MIN= -80 * Math.PI/180;
const CAM_SENSITIVITY = 0.005; // radians per px (tuned to feel like Roblox)
const CHAR_W = 2.0, CHAR_D = 1.0; // studs (capsule approx for AABB)

// ═══════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Roblox sky blue
scene.fog = new THREE.Fog(0x87ceeb, 60, 150);

const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 500);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

// ═══════════════════════════════════════════════
//  LIGHTING
// ═══════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xfff5e0, 1.6);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{near:.5,far:200,left:-50,right:50,top:50,bottom:-50});
scene.add(sun);

// subtle sky fill
const sky = new THREE.HemisphereLight(0x87ceeb, 0x4a7c3f, 0.45);
scene.add(sky);

// ═══════════════════════════════════════════════
//  MATERIALS
// ═══════════════════════════════════════════════
const MAT = {
  grass:  new THREE.MeshStandardMaterial({color:0x5ab552,roughness:.9}),
  stone:  new THREE.MeshStandardMaterial({color:0x9b9b9b,roughness:.8}),
  wood:   new THREE.MeshStandardMaterial({color:0xa0522d,roughness:.85}),
  dirt:   new THREE.MeshStandardMaterial({color:0x8b6332,roughness:.95}),
  brick:  new THREE.MeshStandardMaterial({color:0xb5651d,roughness:.8}),
  skin:   new THREE.MeshStandardMaterial({color:0xffcd9a,roughness:.7}),
  shirt:  new THREE.MeshStandardMaterial({color:0x1f78d1,roughness:.8}),
  pants:  new THREE.MeshStandardMaterial({color:0x1a2540,roughness:.9}),
  shoe:   new THREE.MeshStandardMaterial({color:0x111111,roughness:.8}),
  eye:    new THREE.MeshStandardMaterial({color:0x050505}),
};

// ═══════════════════════════════════════════════
//  BLOCK WORLD
// ═══════════════════════════════════════════════
const BOX_GEO = new THREE.BoxGeometry(4,4,4); // 1 block = 4×4×4 studs
const blockAABBs = []; // THREE.Box3 list for collision

function addBlock(gx,gy,gz,mat){
  const m = new THREE.Mesh(BOX_GEO, MAT[mat]||MAT.stone);
  m.position.set(gx*4+2, gy*4+2, gz*4+2);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  blockAABBs.push(new THREE.Box3().setFromObject(m));
}

// Ground (y=0)
for(let x=-8;x<=8;x++) for(let z=-8;z<=8;z++) addBlock(x,0,z,'grass');

// Platforms & decorative blocks
[
  // [gx, gy, gz, mat]
  [-3,1,-3,'stone'],[-2,1,-3,'stone'],[-1,1,-3,'stone'],
  [-3,2,-3,'stone'],
  [3,1,3,'wood'],[4,1,3,'wood'],[5,1,3,'wood'],
  [3,2,3,'wood'],
  [-5,1,5,'brick'],[-4,1,5,'brick'],
  [6,1,-4,'stone'],[7,1,-4,'stone'],
  [0,1,6,'dirt'],[1,1,6,'dirt'],
  [-7,1,-7,'stone'],[-6,1,-7,'stone'],
  [8,1,7,'brick'],[9,1,7,'brick'],
  // elevated platforms (higher up)
  [-2,3,-5,'stone'],[-1,3,-5,'stone'],[0,3,-5,'stone'],[1,3,-5,'stone'],
  [4,4,0,'wood'],[5,4,0,'wood'],[6,4,0,'wood'],
  [-5,5,2,'stone'],[-4,5,2,'stone'],[-3,5,2,'stone'],
  [2,6,-2,'brick'],[3,6,-2,'brick'],
  [-1,7,4,'stone'],[0,7,4,'stone'],
].forEach(([gx,gy,gz,mat])=>addBlock(gx,gy,gz,mat));

// ═══════════════════════════════════════════════
//  CHARACTER (Roblox-inspired blocky, stud scale)
// ═══════════════════════════════════════════════
const charRoot = new THREE.Group();
scene.add(charRoot);

function part(w,h,d,mat){
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), MAT[mat]);
}
function addPart(mesh,px,py,pz,parent){
  mesh.position.set(px,py,pz);
  mesh.castShadow = true;
  (parent||charRoot).add(mesh);
  return mesh;
}

// Proportions (studs) — close to Roblox R6 skeleton
const head  = addPart(part(2,2,2,'skin'),  0,4.5,0);
const body  = addPart(part(2,2,1,'shirt'), 0,3,  0);
const larmG = new THREE.Group(); larmG.position.set(-1.5,4,0); charRoot.add(larmG);
const rarmG = new THREE.Group(); rarmG.position.set( 1.5,4,0); charRoot.add(rarmG);
const llegG = new THREE.Group(); llegG.position.set(-0.6,2,0); charRoot.add(llegG);
const rlegG = new THREE.Group(); rlegG.position.set( 0.6,2,0); charRoot.add(rlegG);
const larmM = addPart(part(.9,2,.9,'shirt'), 0,-1,0, larmG);
const rarmM = addPart(part(.9,2,.9,'shirt'), 0,-1,0, rarmG);
const llegM = addPart(part(.9,2,.9,'pants'), 0,-1,0, llegG);
const rlegM = addPart(part(.9,2,.9,'pants'), 0,-1,0, rlegG);

// Eyes on head face (+Z forward)
const eyeGeo = new THREE.BoxGeometry(.35,.3,.1);
const eyeL = new THREE.Mesh(eyeGeo,MAT.eye); eyeL.position.set(-.5,.15,1.01);
const eyeR = new THREE.Mesh(eyeGeo,MAT.eye); eyeR.position.set( .5,.15,1.01);
head.add(eyeL,eyeR);

// ═══════════════════════════════════════════════
//  PLAYER STATE
// ═══════════════════════════════════════════════
const player = {
  pos: new THREE.Vector3(0, CHAR_HEIGHT, 0), // feet position
  vel: new THREE.Vector3(),
  onGround: false,
  facingYaw: 0, // character facing angle
};

// ═══════════════════════════════════════════════
//  CAMERA STATE  (Roblox orbit model)
//
//  The camera orbits around a focus point:
//    focus = player.pos + (0, CAM_FOCUS_Y, 0)
//  Yaw   = horizontal angle (rotated by mouse X)
//  Pitch = vertical angle   (rotated by mouse Y, clamped ±80°)
//  Dist  = zoom distance    (scroll wheel)
//
//  Camera position = focus
//    + spherical(dist, yaw, pitch)
//  Camera always looks at focus.
// ═══════════════════════════════════════════════
const cam = {
  yaw:   Math.PI,   // start behind character
  pitch: 0.35,      // slight downward angle
  dist:  CAM_DIST_DEF,
  targetDist: CAM_DIST_DEF,
};
const focusPt = new THREE.Vector3();
const camPos  = new THREE.Vector3();

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════
const keys = {};
let   mdx=0, mdy=0;
let   pointerLocked = false;
let   paused = false;

const canvas = document.getElementById('c');
canvas.addEventListener('click', ()=>{ if(!paused) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = document.pointerLockElement === canvas;
});

document.addEventListener('mousemove', e=>{
  if(!pointerLocked||paused) return;
  mdx += e.movementX;
  mdy += e.movementY;
});

document.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(e.code==='Escape') togglePause();
  // Roblox: Space = jump
  if(e.code==='Space' && player.onGround && !paused){
    player.vel.y = JUMP_POWER;
    player.onGround = false;
  }
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

// Scroll zoom (matches Roblox scroll-to-zoom)
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.targetDist = THREE.MathUtils.clamp(
    cam.targetDist + e.deltaY * 0.04,
    CAM_DIST_MIN, CAM_DIST_MAX
  );
},{passive:false});

// ═══════════════════════════════════════════════
//  PAUSE UI
// ═══════════════════════════════════════════════
const pauseEl  = document.getElementById('pause');
const zoomLbl  = document.getElementById('zoom-lbl');

function togglePause(){
  paused = !paused;
  pauseEl.classList.toggle('open',paused);
  if(paused && pointerLocked) document.exitPointerLock();
}
document.getElementById('menu-btn')  .addEventListener('click', togglePause);
document.getElementById('resume-btn').addEventListener('click', ()=>{ paused=false; pauseEl.classList.remove('open'); });
document.getElementById('exit-btn')  .addEventListener('click', ()=>{ history.back(); });

// ═══════════════════════════════════════════════
//  COLLISION HELPERS
// ═══════════════════════════════════════════════
const _pb = new THREE.Box3();

function playerBox(pos){
  _pb.min.set(pos.x-CHAR_W/2, pos.y,            pos.z-CHAR_D/2);
  _pb.max.set(pos.x+CHAR_W/2, pos.y+CHAR_HEIGHT, pos.z+CHAR_D/2);
  return _pb;
}

// Resolve one axis at a time (standard discrete AABB)
function resolveAxis(axis, delta){
  const next = player.pos.clone();
  next[axis] += delta;
  const pb = playerBox(next);
  for(const bb of blockAABBs){
    if(!pb.intersectsBox(bb)) continue;
    if(delta > 0){
      if(axis==='y'){ next.y = bb.min.y - CHAR_HEIGHT - 0.001; }
      else           { next[axis] = bb.min[axis] - (axis==='x'?CHAR_W/2:CHAR_D/2) - 0.001; }
    } else {
      if(axis==='y'){ next.y = bb.max.y + 0.001; player.onGround=true; }
      else           { next[axis] = bb.max[axis] + (axis==='x'?CHAR_W/2:CHAR_D/2) + 0.001; }
    }
    player.vel[axis] = 0;
    break;
  }
  player.pos[axis] = next[axis];
}

// ═══════════════════════════════════════════════
//  WALK ANIMATION
// ═══════════════════════════════════════════════
let walkT = 0;
function animateChar(moving, dt){
  if(moving && player.onGround) walkT += dt * (WALK_SPEED * 1.8);
  else walkT *= 0.85;
  const s = Math.sin(walkT) * 0.55;
  larmG.rotation.x =  s;
  rarmG.rotation.x = -s;
  llegG.rotation.x = -s;
  rlegG.rotation.x =  s;
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
let last = 0;

function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts-last)/1000, 0.05);
  last = ts;

  if(!paused){
    // ── Camera orbit (Roblox style) ──────────────
    // Apply mouse delta to yaw/pitch
    cam.yaw   -= mdx * CAM_SENSITIVITY;
    cam.pitch  = THREE.MathUtils.clamp(
      cam.pitch + mdy * CAM_SENSITIVITY,
      CAM_PITCH_MIN, CAM_PITCH_MAX
    );
    mdx = mdy = 0;

    // Smooth zoom interpolation
    cam.dist += (cam.targetDist - cam.dist) * Math.min(dt*12, 1);

    // ── Movement (relative to camera yaw) ────────
    // In Roblox WASD moves in camera-relative direction,
    // character auto-rotates to face movement direction
    let mx=0, mz=0;
    if(keys['KeyW']||keys['ArrowUp'])    mz=-1;
    if(keys['KeyS']||keys['ArrowDown'])  mz= 1;
    if(keys['KeyA']||keys['ArrowLeft'])  mx=-1;
    if(keys['KeyD']||keys['ArrowRight']) mx= 1;

    const moving = (mx!==0||mz!==0);

    if(moving){
      // Rotate movement by cam.yaw
      const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
      const wx = mx*cy - mz*sy;
      const wz = mx*sy + mz*cy;
      const len = Math.sqrt(wx*wx+wz*wz);
      player.vel.x = (wx/len)*WALK_SPEED;
      player.vel.z = (wz/len)*WALK_SPEED;
      // AutoRotate: character faces movement direction
      player.facingYaw = Math.atan2(wx, wz);
    } else {
      // Roblox applies no deceleration force — velocity zeroes instantly on ground
      player.vel.x *= player.onGround ? 0.02 : 0.98;
      player.vel.z *= player.onGround ? 0.02 : 0.98;
    }

    // ── Physics ───────────────────────────────────
    player.onGround = false;
    if(!player.onGround || player.vel.y > 0)
      player.vel.y -= GRAVITY * dt;

    // Per-axis collision (X, Y, Z)
    resolveAxis('x', player.vel.x * dt);
    resolveAxis('y', player.vel.y * dt);
    resolveAxis('z', player.vel.z * dt);

    // Kill plane
    if(player.pos.y < -40){ player.pos.set(0,CHAR_HEIGHT,0); player.vel.set(0,0,0); }

    // ── Character mesh ────────────────────────────
    charRoot.position.copy(player.pos);
    charRoot.rotation.y = player.facingYaw;
    animateChar(moving, dt);

    // ── Camera position (spherical orbit) ────────
    // focus = feet + CAM_FOCUS_Y
    focusPt.set(player.pos.x, player.pos.y+CAM_FOCUS_Y, player.pos.z);

    // Spherical coords:  yaw around Y, pitch above horizontal
    const cosPitch = Math.cos(cam.pitch);
    const sinPitch = Math.sin(cam.pitch);
    const cosYaw   = Math.cos(cam.yaw);
    const sinYaw   = Math.sin(cam.yaw);

    camPos.set(
      focusPt.x + cam.dist * sinYaw * cosPitch,
      focusPt.y + cam.dist * sinPitch,
      focusPt.z + cam.dist * cosYaw * cosPitch
    );

    // Smooth camera follow (Roblox uses a fast lerp, ~0.25 lag)
    camera.position.lerp(camPos, Math.min(dt*14, 1));
    camera.lookAt(focusPt);
  }

  // HUD zoom label
  zoomLbl.textContent = `zoom: ${cam.dist.toFixed(1)}`;

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
