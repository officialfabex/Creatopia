<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creatopia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}

#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(6,6,14,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;padding:0 18px;gap:12px;
  z-index:100;
}
#menu-btn{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:38px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.8);transition:background .15s;
}
#menu-btn:hover{background:rgba(255,255,255,.16);color:#fff}
#menu-btn svg{width:18px;height:18px;pointer-events:none}

#pause{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
}
#pause.open{opacity:1;pointer-events:auto}
#pause-panel{
  background:rgba(8,8,18,.97);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:36px 32px;min-width:240px;
  display:flex;flex-direction:column;gap:11px;
  box-shadow:0 28px 72px rgba(0,0,0,.85);
  transform:scale(.93) translateY(10px);
  transition:transform .24s cubic-bezier(.16,1,.3,1);
}
#pause.open #pause-panel{transform:scale(1) translateY(0)}
.pbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 22px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);
  color:#fff;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  transition:background .15s,border-color .15s;
}
.pbtn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24)}
.pbtn.exit{background:rgba(160,40,40,.22);border-color:rgba(220,70,70,.28);color:rgba(255,130,130,.9)}
.pbtn.exit:hover{background:rgba(160,40,40,.4);border-color:rgba(220,70,70,.55);color:#fff}
.pbtn svg{width:16px;height:16px;opacity:.85;flex-shrink:0}
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-btn">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
    </svg>
  </button>
</div>

<div id="pause">
  <div id="pause-panel">
    <button class="pbtn" id="resume-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/>
      </svg>
      Resume
    </button>
    <button class="pbtn exit" id="exit-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
      </svg>
      Exit
    </button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.163.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.163.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────
//  EXACT VALUES FROM BLOKUS.HTML
// ─────────────────────────────────────────────────────────────
const ROBLOX_GRAVITY    = 196.2;
const ROBLOX_JUMP_POWER = 53.8;
const ROBLOX_WALK_SPEED = 16;
const TERMINAL_VELOCITY = -75;

// ─────────────────────────────────────────────────────────────
//  RENDERER / SCENE / CAMERA  (same setup as blokus)
// ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 80, 200);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────────────────────────────────────────────────────────
//  LIGHTING  (same as blokus)
// ─────────────────────────────────────────────────────────────
const hemiLight = new THREE.HemisphereLight(0xaee2ff, 0x55482f, 0.65);
scene.add(hemiLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const dirLight = new THREE.DirectionalLight(0xfff2e0, 1.15);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = dirLight.shadow.mapSize.height = 1536;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far  = 350;
dirLight.shadow.bias = -0.0015;
dirLight.shadow.normalBias = 0.02;
const dRange = 120;
Object.assign(dirLight.shadow.camera, {left:-dRange,right:dRange,top:dRange,bottom:-dRange});
scene.add(dirLight);
scene.add(dirLight.target);

// ─────────────────────────────────────────────────────────────
//  MATERIALS
// ─────────────────────────────────────────────────────────────
const M = {
  grass: new THREE.MeshLambertMaterial({color:0x5ab552}),
  stone: new THREE.MeshLambertMaterial({color:0x9b9b9b}),
  wood:  new THREE.MeshLambertMaterial({color:0xa0522d}),
  dirt:  new THREE.MeshLambertMaterial({color:0x8b6332}),
  brick: new THREE.MeshLambertMaterial({color:0xb5651d}),
  skin:  new THREE.MeshLambertMaterial({color:0xffcd9a}),
  shirt: new THREE.MeshLambertMaterial({color:0x1f78d1}),
  pants: new THREE.MeshLambertMaterial({color:0x1a2540}),
  eye:   new THREE.MeshLambertMaterial({color:0x050505}),
};

// ─────────────────────────────────────────────────────────────
//  COLLISION SYSTEM  (same as blokus: collidersBoxes + OBB SAT)
// ─────────────────────────────────────────────────────────────
const collidersBoxes = [];

function addCollider(box) {
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  collidersBoxes.push({
    type:'box', box,
    cx:c.x, cy:c.y, cz:c.z, r:s.length()/2,
    hx:s.x/2, hy:s.y/2, hz:s.z/2,
    ax:{x:1,y:0,z:0}, ay:{x:0,y:1,z:0}, az:{x:0,y:0,z:1}
  });
}

// AABB vs OBB SAT  (exact copy from blokus)
function testAABBvsOBB(minX,minY,minZ,maxX,maxY,maxZ,obb) {
  const aCx=(minX+maxX)/2,aCy=(minY+maxY)/2,aCz=(minZ+maxZ)/2;
  const aHx=(maxX-minX)/2,aHy=(maxY-minY)/2,aHz=(maxZ-minZ)/2;
  const {ax,ay,az,cx,cy,cz,hx,hy,hz}=obb;
  const eps=1e-6;
  const AR00=Math.abs(ax.x)+eps,AR01=Math.abs(ay.x)+eps,AR02=Math.abs(az.x)+eps;
  const AR10=Math.abs(ax.y)+eps,AR11=Math.abs(ay.y)+eps,AR12=Math.abs(az.y)+eps;
  const AR20=Math.abs(ax.z)+eps,AR21=Math.abs(ay.z)+eps,AR22=Math.abs(az.z)+eps;
  const tx=cx-aCx,ty=cy-aCy,tz=cz-aCz;
  // 15 SAT axes (3 AABB + 3 OBB + 9 cross)
  if(Math.abs(tx)>aHx+hx*AR00+hy*AR01+hz*AR02)return false;
  if(Math.abs(ty)>aHy+hx*AR10+hy*AR11+hz*AR12)return false;
  if(Math.abs(tz)>aHz+hx*AR20+hy*AR21+hz*AR22)return false;
  const tDotA0=tx*ax.x+ty*ax.y+tz*ax.z;
  const tDotA1=tx*ay.x+ty*ay.y+tz*ay.z;
  const tDotA2=tx*az.x+ty*az.y+tz*az.z;
  if(Math.abs(tDotA0)>hx+aHx*AR00+aHy*AR10+aHz*AR20)return false;
  if(Math.abs(tDotA1)>hy+aHx*AR01+aHy*AR11+aHz*AR21)return false;
  if(Math.abs(tDotA2)>hz+aHx*AR02+aHy*AR12+aHz*AR22)return false;
  return true;
}

function checkCollisionWithWorld(testBox) {
  const bc = testBox.getCenter(new THREE.Vector3());
  const bs = testBox.getSize(new THREE.Vector3());
  const tr = bs.length()/2;
  for(const c of collidersBoxes){
    const dx=bc.x-c.cx,dy=bc.y-c.cy,dz=bc.z-c.cz;
    if(dx*dx+dy*dy+dz*dz>(tr+c.r)*(tr+c.r))continue;
    if(testAABBvsOBB(testBox.min.x,testBox.min.y,testBox.min.z,testBox.max.x,testBox.max.y,testBox.max.z,c))return true;
  }
  return false;
}

// ─────────────────────────────────────────────────────────────
//  MAP (ground + scattered blocks)
// ─────────────────────────────────────────────────────────────
function addBlock(x,y,z,w,h,d,mat){
  const geo = new THREE.BoxGeometry(w,h,d);
  const mesh = new THREE.Mesh(geo, M[mat]||M.stone);
  mesh.position.set(x,y,z);
  mesh.castShadow=mesh.receiveShadow=true;
  scene.add(mesh);
  const box=new THREE.Box3().setFromObject(mesh);
  addCollider(box);
}

// Ground
addBlock(0, -0.6, 0, 200, 1.2, 200, 'grass');

// Blocks (x, y, z, w, h, d, mat)
const blocks=[
  [-12,1,-12, 4,4,4,'stone'],[-8,1,-12, 4,4,4,'stone'],
  [-12,5,-12, 4,4,4,'stone'],
  [12,1,12,  4,4,4,'wood'], [16,1,12,  4,4,4,'wood'],
  [12,5,12,  4,4,4,'wood'],
  [-20,1,8,  4,4,4,'brick'],[-16,1,8,  4,4,4,'brick'],
  [20,1,-8,  4,4,4,'stone'],[24,1,-8,  4,4,4,'stone'],
  // platforms
  [-8, 8,-8,  12,1,12,'stone'],
  [ 8, 12, 8, 12,1,12,'wood'],
  [-16,16,-4, 8,1,8, 'brick'],
  [0,  20, 0, 8,1,8, 'stone'],
  // walls
  [-28,1,0, 1,8,20,'stone'],
  [ 28,1,0, 1,8,20,'stone'],
  [0,1,-28, 20,8,1,'stone'],
  [0,1, 28, 20,8,1,'stone'],
];
blocks.forEach(b=>addBlock(...b));

// ─────────────────────────────────────────────────────────────
//  CHARACTER  (same proportions as blokus — playerSize 2×5×1)
// ─────────────────────────────────────────────────────────────
const charRoot = new THREE.Group();
scene.add(charRoot);

function part(w,h,d,mat,px,py,pz,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M[mat]);
  m.position.set(px,py,pz);
  m.castShadow=true;
  (parent||charRoot).add(m);
  return m;
}

// R6-style proportions (studs)
const head = part(2,2,1,'skin', 0,4.2,0);
part(2,2,1,'shirt',  0,2.5,0);   // torso

// Arms — pivots at shoulder top
const lArmG=new THREE.Group(); lArmG.position.set(-1.5,3.5,0); charRoot.add(lArmG);
const rArmG=new THREE.Group(); rArmG.position.set( 1.5,3.5,0); charRoot.add(rArmG);
const lArmM=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),M.shirt); lArmM.position.y=-1; lArmM.castShadow=true; lArmG.add(lArmM);
const rArmM=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),M.shirt); rArmM.position.y=-1; rArmM.castShadow=true; rArmG.add(rArmM);

// Legs — pivots at hip
const lLegG=new THREE.Group(); lLegG.position.set(-0.55,1.5,0); charRoot.add(lLegG);
const rLegG=new THREE.Group(); rLegG.position.set( 0.55,1.5,0); charRoot.add(rLegG);
const lLegM=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),M.pants); lLegM.position.y=-1; lLegM.castShadow=true; lLegG.add(lLegM);
const rLegM=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),M.pants); rLegM.position.y=-1; rLegM.castShadow=true; rLegG.add(rLegM);

// Eyes
const eyeGeo=new THREE.BoxGeometry(.35,.3,.12);
const eyeL=new THREE.Mesh(eyeGeo,M.eye); eyeL.position.set(-.42,.18,.51); head.add(eyeL);
const eyeR=new THREE.Mesh(eyeGeo,M.eye); eyeR.position.set( .42,.18,.51); head.add(eyeR);

const limbs = { leftArm:lArmG, rightArm:rArmG, leftLeg:lLegG, rightLeg:rLegG, head };

// ─────────────────────────────────────────────────────────────
//  PLAYER STATE  (same box as blokus: size 2×5×1)
// ─────────────────────────────────────────────────────────────
const playerSize = new THREE.Vector3(2, 5, 1);
const playerBox  = new THREE.Box3();

function updatePlayerBox(pos){
  playerBox.setFromCenterAndSize(new THREE.Vector3(pos.x, pos.y+2.5, pos.z), playerSize);
}

// player group = charRoot
const player = charRoot;
player.position.set(0, 5, 0);

let yVelocity  = 0;
let isGrounded = false;
let wasGrounded= false;
let animTime   = 0;
let animState  = 'idle';
let airborneTimer = 0;
const AIRBORNE_ANIM_DELAY = 0.13;
let highestYThisJump = player.position.y;
let visualYOffset = 0; // step-up smoothing

// ─────────────────────────────────────────────────────────────
//  CAMERA  — exact same orbit as blokus
//  camRadius, camTheta, camPhi + right-mouse drag
// ─────────────────────────────────────────────────────────────
let camRadius = 15;
let camTheta  = Math.PI;   // yaw
let camPhi    = Math.PI/6; // pitch

let isRightMouseDown = false;

window.addEventListener('mousedown', e=>{ if(e.button===2)isRightMouseDown=true; });
window.addEventListener('mouseup',   e=>{ if(e.button===2)isRightMouseDown=false; });
window.addEventListener('mousemove', e=>{
  if(!isRightMouseDown||isMenuOpen)return;
  camTheta -= e.movementX * 0.008;   // exact from blokus
  camPhi   += e.movementY * 0.008;
  camPhi    = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, camPhi));
});
window.addEventListener('wheel', e=>{
  if(isMenuOpen)return;
  camRadius += e.deltaY * 0.05;       // exact from blokus
  camRadius  = Math.max(5, Math.min(125, camRadius));
});

// ─────────────────────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────────────────────
const keys = {w:false,a:false,s:false,d:false,' ':false};
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k]=true;
  if(e.key==='Escape') togglePause();
});
window.addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k]=false;
});
window.addEventListener('contextmenu', e=>e.preventDefault());

// ─────────────────────────────────────────────────────────────
//  PAUSE
// ─────────────────────────────────────────────────────────────
let isMenuOpen = false;
const pauseEl = document.getElementById('pause');

function togglePause(){ setMenuOpen(!isMenuOpen); }
function openPauseMenu(){  setMenuOpen(true);  }
function closePauseMenu(){ setMenuOpen(false); }

function setMenuOpen(open){
  isMenuOpen=open;
  pauseEl.classList.toggle('open',open);
}

document.getElementById('menu-btn')  .addEventListener('click', openPauseMenu);
document.getElementById('resume-btn').addEventListener('click', closePauseMenu);
document.getElementById('exit-btn')  .addEventListener('click', ()=>history.back());

// ─────────────────────────────────────────────────────────────
//  STEP-UP / MOVE AXIS  (exact copy of blokus moveAxis logic)
// ─────────────────────────────────────────────────────────────
function moveAxis(axis, amount){
  const originalY = player.position.y;
  player.position[axis] += amount;
  updatePlayerBox(player.position);

  if(checkCollisionWithWorld(playerBox)){
    // auto step-up only when grounded
    if(!isGrounded){
      player.position.y = originalY;
      player.position[axis] -= amount;
      updatePlayerBox(player.position);
      return;
    }
    player.position.y += 1.51;
    updatePlayerBox(player.position);
    if(!checkCollisionWithWorld(playerBox)){
      let stepFound=false;
      for(let drop=0; drop<=1.51; drop+=0.1){
        player.position.y -= 0.1;
        updatePlayerBox(player.position);
        if(checkCollisionWithWorld(playerBox)){
          player.position.y += 0.1;
          updatePlayerBox(player.position);
          stepFound=true; break;
        }
      }
      if(stepFound){ visualYOffset -= (player.position.y - originalY); }
      else { player.position.y=originalY; player.position[axis]-=amount; }
    } else {
      player.position.y=originalY;
      player.position[axis]-=amount;
      updatePlayerBox(player.position);
    }
  }
}

// ─────────────────────────────────────────────────────────────
//  ANIMATION  (same as blokus applyAnimations)
// ─────────────────────────────────────────────────────────────
function applyAnimations(state, dt, t){
  let lAx=0,rAx=0,lLx=0,rLx=0;
  if(state==='jumping'){
    lAx=rAx=-Math.PI*0.8;
  } else if(state==='moving'){
    const swing=Math.sin(t)*0.8;
    rAx=swing; lAx=-swing;
    lLx=-swing; rLx=swing;
  }
  const s=12*dt;
  lArmG.rotation.x=THREE.MathUtils.lerp(lArmG.rotation.x,lAx,s);
  rArmG.rotation.x=THREE.MathUtils.lerp(rArmG.rotation.x,rAx,s);
  lLegG.rotation.x=THREE.MathUtils.lerp(lLegG.rotation.x,lLx,s);
  rLegG.rotation.x=THREE.MathUtils.lerp(rLegG.rotation.x,rLx,s);
}

// ─────────────────────────────────────────────────────────────
//  GAME LOOP  (physics + camera identical to blokus animate())
// ─────────────────────────────────────────────────────────────
const clock   = new THREE.Clock();
const _moveDir   = new THREE.Vector3();
const _camFwd    = new THREE.Vector3();
const _camRight  = new THREE.Vector3();
const _headPos   = new THREE.Vector3();
const _idealCam  = new THREE.Vector3();
const _upAxis    = new THREE.Vector3(0,1,0);
const _targetQ   = new THREE.Quaternion();
const _dirLightOffset = new THREE.Vector3(20,40,20);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(isMenuOpen){ renderer.render(scene,camera); return; }

  // ── Grounded check (probe 0.1 below) ──────────────────────
  wasGrounded = isGrounded;
  player.position.y -= 0.1;
  updatePlayerBox(player.position);
  isGrounded = checkCollisionWithWorld(playerBox);
  player.position.y += 0.1;
  updatePlayerBox(player.position);

  // ── Gravity / jump ────────────────────────────────────────
  if(!isGrounded){
    yVelocity += -ROBLOX_GRAVITY * dt;
    if(yVelocity < TERMINAL_VELOCITY) yVelocity = TERMINAL_VELOCITY;
    if(player.position.y > highestYThisJump) highestYThisJump = player.position.y;
    airborneTimer += dt;
    if(airborneTimer > AIRBORNE_ANIM_DELAY) animState='jumping';
  } else {
    airborneTimer = 0;
    if(yVelocity < 0) yVelocity = 0;
    if(keys[' ']){
      yVelocity = ROBLOX_JUMP_POWER;
      isGrounded = false;
      highestYThisJump = player.position.y;
      airborneTimer = AIRBORNE_ANIM_DELAY + 1;
      animState = 'jumping';
    }
  }

  // ── Vertical movement + resolve ───────────────────────────
  player.position.y += yVelocity * dt;
  updatePlayerBox(player.position);
  if(checkCollisionWithWorld(playerBox)){
    if(yVelocity < 0){
      for(let i=0;i<100;i++){
        player.position.y += 0.05;
        updatePlayerBox(player.position);
        if(!checkCollisionWithWorld(playerBox)) break;
      }
      isGrounded = true;
      highestYThisJump = player.position.y;
      yVelocity = 0;
    } else {
      for(let i=0;i<100;i++){
        player.position.y -= 0.05;
        updatePlayerBox(player.position);
        if(!checkCollisionWithWorld(playerBox)) break;
      }
      yVelocity = 0;
    }
  }

  // void kill plane
  if(player.position.y < -80){ player.position.set(0,5,0); yVelocity=0; }

  // ── Horizontal movement ───────────────────────────────────
  _moveDir.set(0,0,0);
  camera.getWorldDirection(_camFwd);
  _camFwd.y=0; _camFwd.normalize();
  _camRight.crossVectors(_camFwd,_upAxis).negate().normalize();

  let isMoving=false;
  if(keys['w']){ _moveDir.add(_camFwd);   isMoving=true; }
  if(keys['s']){ _moveDir.sub(_camFwd);   isMoving=true; }
  if(keys['d']){ _moveDir.sub(_camRight); isMoving=true; }
  if(keys['a']){ _moveDir.add(_camRight); isMoving=true; }

  if(isMoving){
    _moveDir.normalize();
    moveAxis('x', _moveDir.x * ROBLOX_WALK_SPEED * dt);
    moveAxis('z', _moveDir.z * ROBLOX_WALK_SPEED * dt);
    _targetQ.setFromAxisAngle(_upAxis, Math.atan2(_moveDir.x, _moveDir.z));
    player.quaternion.slerp(_targetQ, 15*dt);
    if(isGrounded) animState='moving';
  } else {
    if(isGrounded) animState='idle';
  }

  // step-up visual smooth
  visualYOffset = THREE.MathUtils.lerp(visualYOffset, 0, 15*dt);

  // ── Animation ─────────────────────────────────────────────
  if(animState==='moving') animTime += dt * ROBLOX_WALK_SPEED * 0.6;
  else if(animState==='idle') animTime = 0;
  else animTime += dt * 5;
  applyAnimations(animState, dt, animTime);

  // ── Camera — exact same formula as blokus ─────────────────
  _headPos.set(player.position.x, player.position.y+4.5, player.position.z);
  _idealCam.set(
    _headPos.x + camRadius * Math.sin(camTheta) * Math.cos(camPhi),
    _headPos.y + camRadius * Math.sin(camPhi),
    _headPos.z + camRadius * Math.cos(camTheta) * Math.cos(camPhi)
  );
  camera.position.copy(_idealCam);
  camera.lookAt(_headPos);

  // ── Move dirLight with player (shadow follows) ────────────
  dirLight.position.copy(player.position).add(_dirLightOffset);
  dirLight.target.position.copy(player.position);
  dirLight.target.updateMatrixWorld();

  renderer.render(scene, camera);
}
animate();
</script>
