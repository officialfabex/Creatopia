<!DOCTYPE html>
<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;user-select:none}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(6,6,14,.82);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;padding:0 18px;gap:10px;z-index:100}
.tb-btn{display:flex;align-items:center;justify-content:center;gap:7px;height:38px;
  padding:0 14px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:12px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.16);color:#fff}

  display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#pause.open{opacity:1;pointer-events:auto}
#pause-panel{background:rgba(8,8,18,.97);border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:36px 32px;min-width:240px;display:flex;flex-direction:column;gap:11px;
  box-shadow:0 28px 72px rgba(0,0,0,.85);transform:scale(.93) translateY(10px);
  transition:transform .24s cubic-bezier(.16,1,.3,1)}
#pause.open #pause-panel{transform:scale(1) translateY(0)}
.pbtn{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;
  border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);
  color:#fff;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:background .15s}
.pbtn:hover{background:rgba(255,255,255,.16)}
.pbtn.exit{background:rgba(160,40,40,.22);border-color:rgba(220,70,70,.28);color:rgba(255,130,130,.9)}
.pbtn.exit:hover{background:rgba(160,40,40,.4);color:#fff}
.pbtn svg{width:16px;height:16px;opacity:.85;flex-shrink:0}
#studio-hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(8,8,18,.88);border:1px solid rgba(255,255,255,.1);border-radius:10px;
  padding:8px 18px;font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;z-index:90;display:none;white-space:nowrap}
#studio-hint.show{display:block}
</style>
</head>
<body>

<div id="topbar">

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.163.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.163.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { applyAnimations } from './animations.js';

// ── constants ─────────────────────────────────────────────────
const GRAVITY    = 196.2;
const JUMP_POWER = 53.8;
const WALK_SPEED = 16;
const TERM_VEL   = -75;
const AIRBORNE_T = 0.13;
const MENU_URL   = '../../index.html#home';

// ── renderer / scene / camera ─────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 80, 200);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── lighting ──────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xaee2ff, 0x55482f, 0.65));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const dirLight = new THREE.DirectionalLight(0xfff2e0, 1.15);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1536, 1536);
Object.assign(dirLight.shadow.camera, {near:.5,far:350,left:-120,right:120,top:120,bottom:-120});
dirLight.shadow.bias = -0.0015;
dirLight.shadow.normalBias = 0.02;
scene.add(dirLight, dirLight.target);

// ── collision ─────────────────────────────────────────────────
const colliders = [];

function addCollider(box) {
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  colliders.push({
    cx:c.x, cy:c.y, cz:c.z, r:s.length()/2,
    hx:s.x/2, hy:s.y/2, hz:s.z/2,
    ax:{x:1,y:0,z:0}, ay:{x:0,y:1,z:0}, az:{x:0,y:0,z:1}
  });
}

function testOBB(minX,minY,minZ,maxX,maxY,maxZ,o) {
  const aCx=(minX+maxX)/2, aCy=(minY+maxY)/2, aCz=(minZ+maxZ)/2;
  const aHx=(maxX-minX)/2, aHy=(maxY-minY)/2, aHz=(maxZ-minZ)/2;
  const e=1e-6;
  const tx=o.cx-aCx, ty=o.cy-aCy, tz=o.cz-aCz;
  if(Math.abs(tx)>aHx+o.hx*(Math.abs(o.ax.x)+e)+o.hy*(Math.abs(o.ay.x)+e)+o.hz*(Math.abs(o.az.x)+e))return false;
  if(Math.abs(ty)>aHy+o.hx*(Math.abs(o.ax.y)+e)+o.hy*(Math.abs(o.ay.y)+e)+o.hz*(Math.abs(o.az.y)+e))return false;
  if(Math.abs(tz)>aHz+o.hx*(Math.abs(o.ax.z)+e)+o.hy*(Math.abs(o.ay.z)+e)+o.hz*(Math.abs(o.az.z)+e))return false;
  return true;
}

function hitTest(box) {
  const bc = box.getCenter(new THREE.Vector3());
  const tr = box.getSize(new THREE.Vector3()).length() / 2;
  for (const c of colliders) {
    const dx=bc.x-c.cx, dy=bc.y-c.cy, dz=bc.z-c.cz;
    if (dx*dx+dy*dy+dz*dz > (tr+c.r)*(tr+c.r)) continue;
    if (testOBB(box.min.x,box.min.y,box.min.z, box.max.x,box.max.y,box.max.z, c)) return true;
  }
  return false;
}

// ── map ───────────────────────────────────────────────────────
const MATS = {
  grass: new THREE.MeshLambertMaterial({color:0x5ab552}),
  stone: new THREE.MeshLambertMaterial({color:0x9b9b9b}),
  wood:  new THREE.MeshLambertMaterial({color:0xa0522d}),
  brick: new THREE.MeshLambertMaterial({color:0xb5651d}),
};

function addBlock(x,y,z,w,h,d,mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  mesh.position.set(x,y,z);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  addCollider(new THREE.Box3().setFromObject(mesh));
  return mesh;
}

addBlock(0,-0.6,0, 200,1.2,200, MATS.grass);
[[-12,2,-12,4,4,4,'stone'],[-8,2,-12,4,4,4,'stone'],[-12,6,-12,4,4,4,'stone'],
 [12,2,12,4,4,4,'wood'],[16,2,12,4,4,4,'wood'],[12,6,12,4,4,4,'wood'],
 [-20,2,8,4,4,4,'brick'],[-16,2,8,4,4,4,'brick'],
 [20,2,-8,4,4,4,'stone'],[24,2,-8,4,4,4,'stone'],
 [-8,9,-8,12,1,12,'stone'],[8,13,8,12,1,12,'wood'],
 [-16,17,-4,8,1,8,'brick'],[0,21,0,8,1,8,'stone'],
].forEach(([x,y,z,w,h,d,m])=>addBlock(x,y,z,w,h,d,MATS[m]));

// ── skin coloring ─────────────────────────────────────────────
const PART_KEYS = ['head','torso','arms','legs'];
const DEFAULT_SKIN = '#FFCD9A';
const skinMeshes = [];

function loadSkin() {
  const d = {head:DEFAULT_SKIN,torso:DEFAULT_SKIN,arms:DEFAULT_SKIN,legs:DEFAULT_SKIN};
  try { Object.assign(d, JSON.parse(localStorage.getItem('creatopia_skin_parts')||'{}')); } catch(e){}
  return d;
}
let skinColors = loadSkin();

function partFromName(n) {
  n = (n||'').toLowerCase().replace(/armature/g,'');
  if (/head|face|skull|neck/.test(n)) return 'head';
  if (/arm|hand|shoulder/.test(n))    return 'arms';
  if (/leg|foot|thigh|knee/.test(n))  return 'legs';
  if (/torso|chest|spine|pelvis/.test(n)) return 'torso';
  return null;
}

function prepareSkin(root) {
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const H = (box.max.y - box.min.y) || 1;
  const cx = (box.min.x + box.max.x) / 2;
  const v = new THREE.Vector3();
  root.traverse(m => {
    if (!m.isMesh) return;
    m.geometry = m.geometry.clone();
    const pos = m.geometry.attributes.position, n = pos.count;
    m.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n*3), 3));
    m.material = new THREE.MeshStandardMaterial({vertexColors:true, roughness:.85, metalness:0});
    const named = m.userData.part || partFromName(m.name);
    if (named) { m.userData.part = named; skinMeshes.push(m); return; }
    const idx = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
      const hh = (v.y - box.min.y) / H, ax = Math.abs(v.x - cx) / H;
      idx[i] = hh > 0.78 ? 0 : hh < 0.4 ? 3 : ax > 0.21 ? 2 : 1;
    }
    m.userData.partIdx = idx;
    skinMeshes.push(m);
  });
  paintSkin();
}

function paintSkin() {
  const cc = {};
  PART_KEYS.forEach(k => cc[k] = new THREE.Color(skinColors[k]));
  skinMeshes.forEach(m => {
    const attr = m.geometry.attributes.color, arr = attr.array;
    const idx = m.userData.partIdx, fixed = m.userData.part;
    for (let i = 0; i < arr.length/3; i++) {
      const c = cc[fixed || PART_KEYS[idx[i]]];
      arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b;
    }
    attr.needsUpdate = true;
  });
}

window.addEventListener('storage', e => {
  if (e.key === 'creatopia_skin_parts') { skinColors = loadSkin(); paintSkin(); }
});

// ── player model ──────────────────────────────────────────────
const playerGroup = new THREE.Group();
scene.add(playerGroup);
playerGroup.position.set(0, 5, 0);

function buildFallback() {
  const g = new THREE.Group();
  const b = (w,h,d,part,parent,px,py,pz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial());
    m.userData.part = part; m.position.set(px,py,pz); m.castShadow = true; parent.add(m); return m;
  };
  b(2,2,1,'head',g,0,4.2,0);
  b(2,2,1,'torso',g,0,2.5,0);
  const lAG=new THREE.Group(); lAG.position.set(-1.5,3.5,0); g.add(lAG);
  const rAG=new THREE.Group(); rAG.position.set( 1.5,3.5,0); g.add(rAG);
  const lLG=new THREE.Group(); lLG.position.set(-0.55,1.5,0); g.add(lLG);
  const rLG=new THREE.Group(); rLG.position.set( 0.55,1.5,0); g.add(rLG);
  [lAG,rAG].forEach(ag => b(1,2,1,'arms',ag,0,-1,0));
  [lLG,rLG].forEach(lg => b(1,2,1,'legs',lg,0,-1,0));
  return {g, lAG, rAG, lLG, rLG};
}

const fb = buildFallback();
playerGroup.add(fb.g);
prepareSkin(fb.g);

let charLimbs = {lAG:fb.lAG, rAG:fb.rAG, lLG:fb.lLG, rLG:fb.rLG};

new GLTFLoader().load('../../assets/models/CreatopiaBody.glb', gltf => {
  playerGroup.remove(fb.g);
  skinMeshes.length = 0;
  const model = gltf.scene;
  const sz = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
  model.scale.setScalar(5 / sz.y);
  model.position.y = -new THREE.Box3().setFromObject(model).min.y;
  model.traverse(c => { if (c.isMesh) { c.castShadow = c.receiveShadow = true; } });
  playerGroup.add(model);
  prepareSkin(model);
  const find = n => model.getObjectByName(n);
  const lA = find('LeftArm')  || find('Left_Arm')  || find('leftArm');
  const rA = find('RightArm') || find('Right_Arm') || find('rightArm');
  const lL = find('LeftLeg')  || find('Left_Leg')  || find('leftLeg');
  const rL = find('RightLeg') || find('Right_Leg') || find('rightLeg');
  if (lA && rA && lL && rL) charLimbs = {lAG:lA, rAG:rA, lLG:lL, rLG:rL};
}, null, err => console.warn('GLB failed, using fallback', err));

// ── player state ──────────────────────────────────────────────
const pSize = new THREE.Vector3(2, 5, 1);
const pBox  = new THREE.Box3();
const updateBox = pos => pBox.setFromCenterAndSize(new THREE.Vector3(pos.x, pos.y+2.5, pos.z), pSize);

let yVel=0, grounded=false, animTime=0, animState='idle', airTimer=0, highY=5, visOff=0;

// ── camera ────────────────────────────────────────────────────
let camR=15, camT=Math.PI, camP=Math.PI/6, rightDown=false;
window.addEventListener('mousedown', e => { if(e.button===2) rightDown=true; });
window.addEventListener('mouseup',   e => { if(e.button===2) rightDown=false; });
window.addEventListener('mousemove', e => {
  if (!rightDown || isMenu || studioMode) return;
  camT -= e.movementX * 0.008;
  camP  = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, camP + e.movementY*0.008));
});
window.addEventListener('wheel', e => {
  if (!isMenu) camR = Math.max(5, Math.min(125, camR + e.deltaY*0.05));
});
window.addEventListener('contextmenu', e => e.preventDefault());

// ── input ─────────────────────────────────────────────────────
const keys = {w:0,a:0,s:0,d:0,' ':0};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = 1;
  if (e.key === 'Escape') toggleMenu();
});
window.addEventListener('keyup', e => { const k=e.key.toLowerCase(); if(k in keys) keys[k]=0; });

// ── pause ─────────────────────────────────────────────────────
let isMenu = false;
const pauseEl = document.getElementById('pause');
const toggleMenu = () => setMenu(!isMenu);
const setMenu = v => { isMenu=v; pauseEl.classList.toggle('open',v); };

document.getElementById('menu-btn')  .addEventListener('click', () => setMenu(true));
document.getElementById('resume-btn').addEventListener('click', () => setMenu(false));
document.getElementById('exit-btn')  .addEventListener('click', () => {
  window.close();
  setTimeout(() => { if (!window.closed) location.href = MENU_URL; }, 150);
});

// ── studio ────────────────────────────────────────────────────
let studioMode=false, sTheta=Math.PI, sPhi=0.4, sDist=30, sRightDown=false;
const sTgt = new THREE.Vector3(0,2,0);
const ray  = new THREE.Raycaster();
const sMat = new THREE.MeshLambertMaterial({color:0x6688cc});

document.getElementById('studio-btn').addEventListener('click', () => {
  studioMode = !studioMode;
  document.getElementById('studio-btn').classList.toggle('active', studioMode);
  document.getElementById('mode-label').textContent = studioMode ? 'Studio' : 'Player';
  document.getElementById('studio-hint').classList.toggle('show', studioMode);
  playerGroup.visible = !studioMode;
});

window.addEventListener('mousedown', e => {
  if (!studioMode || isMenu || e.target.closest?.('#topbar')) return;
  if (e.button === 2) { sRightDown=true; return; }
  if (e.button === 0) {
    ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
    const meshes=[]; scene.traverse(c => { if(c.isMesh) meshes.push(c); });
    const hit = ray.intersectObjects(meshes, true)[0];
    if (hit) {
      const B=4, n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const p=hit.point;
      const bx=Math.round((p.x+n.x*B/2)/B)*B, by=Math.round((p.y+n.y*B/2)/B)*B, bz=Math.round((p.z+n.z*B/2)/B)*B;
      const nb=new THREE.Mesh(new THREE.BoxGeometry(B,B,B), sMat.clone());
      nb.position.set(bx,by,bz); nb.castShadow=nb.receiveShadow=true;
      scene.add(nb); addCollider(new THREE.Box3().setFromObject(nb));
    }
  }
});
window.addEventListener('mouseup', e => { if(e.button===2) sRightDown=false; });
window.addEventListener('mousemove', e => {
  if (!studioMode||!sRightDown||isMenu) return;
  sTheta -= e.movementX*0.008;
  sPhi = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, sPhi+e.movementY*0.008));
});

// ── step-up / moveAxis ────────────────────────────────────────
function moveAxis(axis, d) {
  const oy = playerGroup.position.y;
  playerGroup.position[axis] += d;
  updateBox(playerGroup.position);
  if (!hitTest(pBox)) return;
  if (!grounded) { playerGroup.position.y=oy; playerGroup.position[axis]-=d; updateBox(playerGroup.position); return; }
  playerGroup.position.y += 1.51; updateBox(playerGroup.position);
  if (!hitTest(pBox)) {
    let ok=false;
    for (let i=0; i<=1.51; i+=0.1) {
      playerGroup.position.y-=0.1; updateBox(playerGroup.position);
      if (hitTest(pBox)) { playerGroup.position.y+=0.1; updateBox(playerGroup.position); ok=true; break; }
    }
    if (ok) visOff -= playerGroup.position.y-oy;
    else { playerGroup.position.y=oy; playerGroup.position[axis]-=d; }
  } else { playerGroup.position.y=oy; playerGroup.position[axis]-=d; updateBox(playerGroup.position); }
}

// ── reusable vectors ──────────────────────────────────────────
const vFwd   = new THREE.Vector3();
const vRight = new THREE.Vector3();
const vHead  = new THREE.Vector3();
const vCam   = new THREE.Vector3();
const vUp    = new THREE.Vector3(0,1,0);
const qTgt   = new THREE.Quaternion();
const vOff   = new THREE.Vector3(20,40,20);

// ── game loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (isMenu) { renderer.render(scene,camera); return; }

  if (studioMode) {
    camera.position.set(
      sTgt.x+sDist*Math.sin(sTheta)*Math.cos(sPhi),
      sTgt.y+sDist*Math.sin(sPhi),
      sTgt.z+sDist*Math.cos(sTheta)*Math.cos(sPhi)
    );
    camera.lookAt(sTgt);
    renderer.render(scene,camera);
    return;
  }

  // ground probe
  playerGroup.position.y -= 0.1; updateBox(playerGroup.position);
  grounded = hitTest(pBox);
  playerGroup.position.y += 0.1; updateBox(playerGroup.position);

  // gravity / jump
  if (!grounded) {
    yVel = Math.max(yVel - GRAVITY*dt, TERM_VEL);
    highY = Math.max(highY, playerGroup.position.y);
    airTimer += dt;
    if (airTimer > AIRBORNE_T) animState = 'jumping';
  } else {
    airTimer = 0;
    if (yVel < 0) yVel = 0;
    if (keys[' ']) { yVel=JUMP_POWER; grounded=false; highY=playerGroup.position.y; airTimer=AIRBORNE_T+1; animState='jumping'; }
  }

  // vertical resolve
  playerGroup.position.y += yVel*dt; updateBox(playerGroup.position);
  if (hitTest(pBox)) {
    const dir = yVel < 0 ? 1 : -1;
    for (let i=0;i<100;i++) { playerGroup.position.y+=dir*0.05; updateBox(playerGroup.position); if(!hitTest(pBox))break; }
    if (yVel < 0) { grounded=true; highY=playerGroup.position.y; }
    yVel = 0;
  }
  if (playerGroup.position.y < -80) { playerGroup.position.set(0,5,0); yVel=0; }

  // horizontal movement
  vFwd.set(0,0,0); camera.getWorldDirection(vFwd); vFwd.y=0; vFwd.normalize();
  vRight.crossVectors(vFwd, vUp).negate().normalize();
  const mv = new THREE.Vector3();
  if (keys['w']) mv.add(vFwd);
  if (keys['s']) mv.sub(vFwd);
  if (keys['d']) mv.sub(vRight);
  if (keys['a']) mv.add(vRight);
  const moving = mv.lengthSq() > 0;
  if (moving) {
    mv.normalize();
    moveAxis('x', mv.x*WALK_SPEED*dt);
    moveAxis('z', mv.z*WALK_SPEED*dt);
    qTgt.setFromAxisAngle(vUp, Math.atan2(mv.x, mv.z));
    playerGroup.quaternion.slerp(qTgt, 15*dt);
    if (grounded) animState = 'moving';
  } else if (grounded) {
    animState = 'idle';
  }

  visOff = THREE.MathUtils.lerp(visOff, 0, 15*dt);

  // animation timer
  if      (animState==='moving')  animTime += dt * WALK_SPEED * 0.6;
  else if (animState==='idle')    animTime  = 0;
  else                            animTime += dt * 5;

  applyAnimations(charLimbs, animState, dt, animTime, moving);

  // camera
  vHead.set(playerGroup.position.x, playerGroup.position.y+4.5, playerGroup.position.z);
  camera.position.set(
    vHead.x + camR*Math.sin(camT)*Math.cos(camP),
    vHead.y + camR*Math.sin(camP),
    vHead.z + camR*Math.cos(camT)*Math.cos(camP)
  );
  camera.lookAt(vHead);

  dirLight.position.copy(playerGroup.position).add(vOff);
  dirLight.target.position.copy(playerGroup.position);
  dirLight.target.updateMatrixWorld();

  renderer.render(scene, camera);
}
animate();
</script>
