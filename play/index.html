<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
// Extract game ID from URL: /play/1 → id=1
const id = location.pathname.split('/').filter(Boolean)[1] || '1';
// Store for engine to read
sessionStorage.setItem('creatopia_game_id', id);
// Redirect to the actual engine
location.replace('../scripts/game/engine.html');
</script>
</head>
<body></body>
</html>
